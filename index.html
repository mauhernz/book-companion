s old university friend. Now commanding an army of his own.","tags":["nobility"]},{"id":"demoux","category":"characters","name":"Demoux","book":1,"chapter":23,"meta":"Captain","desc":"A quiet, dependable soldier who rises through the rebellion's ranks.","tags":["skaa"]},{"id":"tensoon","category":"characters","name":"TenSoon","book":2,"chapter":36,"meta":"Kandra","desc":"A kandra of the Third Generation. Proud, dutiful, and carrying secrets.","tags":["kandra"]},{"id":"vinsmom","category":"characters","name":"Vin's Mother","book":1,"chapter":1,"meta":"Remembered","desc":"A half-remembered figure. Vin only remembers screaming.","tags":["skaa"]},{"id":"preservation","category":"characters","name":"Preservation","book":2,"chapter":32,"meta":"Shard of Adonalsium","desc":"One of the two gods of Scadrial. A deific mind of stability and protection.","tags":["shard"]},{"id":"ruin","category":"characters","name":"Ruin","book":3,"chapter":5,"meta":"Shard of Adonalsium","desc":"The opposing god. A mind that craves entropy and the end of all things.","tags":["shard","antagonist"]},{"id":"vin-father","category":"characters","name":"Vin's Father","book":1,"chapter":19,"meta":"Unknown","desc":"A figure of cruelty in Vin's past. An obligator, supposedly.","tags":["nobility"]},{"id":"quellion","category":"characters","name":"Quellion","book":3,"chapter":14,"meta":"Citizen-King","desc":"The self-styled Citizen of Urteau. Rules through skaa zealotry and executions.","tags":["skaa","antagonist"]},{"id":"yomen","category":"characters","name":"Aradan Yomen","book":3,"chapter":21,"meta":"Obligator King","desc":"The obligator ruling Fadrex City. Intelligent, devout, disconcertingly reasonable.","tags":["obligator","antagonist"]},{"id":"luthadel","category":"places","name":"Luthadel","book":1,"chapter":1,"meta":"Capital","desc":"The Lord Ruler's capital. A city of iron spires, ashfall, and a thousand years of rule.","tags":["capital"]},{"id":"kredik-shaw","category":"places","name":"Kredik S rs who consume a body and reshape themselves to match it exactly. Bound by Contract.","tags":["shapeshifter"]},{"id":"koloss","category":"creatures","name":"Koloss","book":1,"chapter":20,"meta":"War beasts","desc":"Blue-skinned, ever-growing giants. Violent, stupid, utterly obedient — to someone.","tags":["monster"]},{"id":"mistwraiths","category":"creatures","name":"Mistwraiths","book":1,"chapter":18,"meta":"Mist creature","desc":"Animalistic bone-and-skin creatures that drift through the mists. Less than they once were.","tags":["monster"]},{"id":"the-mist","category":"creatures","name":"The Mist","book":1,"chapter":1,"meta":"Phenomenon","desc":"Thick silver fog that rolls across the land every night. Skaa huddle indoors; Mistborn ride through it.","tags":["phenomenon"]},{"id":"mist-spirit","category":"creatures","name":"The Mist Spirit","book":2,"chapter":9,"meta":"Unknown","desc":"A flickering presence Vin glimpses in the mists. It seems to be trying to warn her.","tags":["mystery"]},{"id":"deepness","category":"lore","name":"The Deepness","book":1,"chapter":7,"meta":"Ancient threat","desc":"A terror the Hero of Ages defeated a thousand years ago. Exactly what it was — no one agrees.","tags":["mythic"]},{"id":"hero-of-ages","category":"lore","name":"The Hero of Ages","book":1,"chapter":7,"meta":"Prophecy","desc":"A prophesied figure from Terris lore. Supposed to take up power at the Well of Ascension and save the world.","tags":["prophecy"]},{"id":"ashmounts","category":"lore","name":"The Ashmounts","book":1,"chapter":1,"meta":"Geography","desc":"Great volcanic mountains scattered across the Empire. They rain ash ceaselessly over the land.","tags":["world"]},{"id":"ash-falls","category":"lore","name":"Ashfall","book":1,"chapter":1,"meta":"Environment","desc":"Dark flakes from the Ashmounts. They coat every street, rooftop, and field — perpetually.","tags":["world"]},{"id":"red-sun","category":"lore","name":"The Red Sun","book":1,"chapter":1,"meta":"Sky","desc":"A sullen red sun that never fully clears the haze. The world has not seen green sky in a thousand years.","tags":["world"]},{"id":"ascension","category":"lore","name":"The Ascension","book":1,"chapter":7,"meta":"Historical event","desc":"The Lord Ruler's taking of power at the Well a thousand years ago. His origin, such as it is known.","tags":["history"]},{"id":"terris-prophecy","category":"lore","name":"Terris Prophecies","book":1,"chapter":6,"meta":"Religion","desc":"Ancient Terris scriptures foretelling the Hero. Long suppressed by the Ministry.","tags":["religion"]},{"id":"allomancy-rules","category":"lore","name":"The Rules of Allomancy","book":1,"chapter":11,"meta":"Magic law","desc":"Bronze reveals. Copper hides. The basic-eight metals come in complementary pairs. Everything has balance.","tags":["magic"]},{"id":"well-ascension-lore","category":"lore","name":"The Well of Ascension (legend)","book":1,"chapter":7,"meta":"Legend","desc":"The Terris prophecy's promised power. A second coming, a thousand years after the first.","tags":["prophecy"]},{"id":"religions-collected","category":"lore","name":"Sazed's Religions","book":1,"chapter":16,"meta":"Scholarship","desc":"Sazed has catalogued hundreds of dead religions in his copperminds. Each wiped out by the Ministry.","tags":["religion"]},{"id":"first-contract","category":"lore","name":"The First Contract","book":2,"chapter":36,"meta":"Kandra law","desc":"The foundational contract between kandra and their creator. Secret even to most kandra.","tags":["kandra"]},{"id":"savant","category":"lore","name":"Allomantic Savants","book":2,"chapter":42,"meta":"Phenomenon","desc":"Allomancers who burn one metal constantly until the ability warps and deepens. Mental cost: profound.","tags":["magic"]},{"id":"pulses-at-the-well","category":"lore","name":"The Pulsing","book":2,"chapter":1,"meta":"Phenomenon","desc":"A rhythmic pulse Vin feels growing stronger across the land. Something at the Well is waking.","tags":["mystery"]},{"id":"kandra-blessings","category":"lore","name":"The Kandra Blessings","book":3,"chapter":19,"meta":"Kandra lore","desc":"Each kandra carries two small spikes granting one of four gifts: Presence, Potency, Awareness, Stability.","tags":["kandra"]},{"id":"ruin-influence","category":"lore","name":"Ruin's Influence","book":3,"chapter":5,"meta":"Power","desc":"Ruin can subtly alter any written text touched by metal. Trust nothing set in type.","tags":["power"]}]}</script>

<script type="text/babel" data-presets="react">
const { useState, useMemo, useRef, useEffect } = React;

// -- Simple inline icons (no lucide) ---------------------------------------
const Icon = {
  Search: () => <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>,
  Upload: ({ size = 14 }) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>,
  Download: ({ size = 14 }) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>,
  Book: ({ size = 14 }) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>,
  Lock: () => <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>,
  Alert: () => <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>,
  Check: () => <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="20 6 9 17 4 12"/></svg>,
  File: ({ size = 16 }) => <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>,
};

// -- Bundled codices -------------------------------------------------------
const HP_CODEX = JSON.parse(document.getElementById('hp-codex').textContent);
const MB_CODEX = JSON.parse(document.getElementById('mb-codex').textContent);

const BUNDLED = [
  { id: 'hp', label: 'Harry Potter', data: HP_CODEX },
  { id: 'mistborn', label: 'Mistborn: Era 1', data: MB_CODEX },
];

// -- localStorage helpers --------------------------------------------------
const LS_KEYS = {
  progress: 'codex-progress-v1',      // { [codexId]: { book, chapter, category } }
  activeId: 'codex-active-id-v1',     // current codex id
  customCodices: 'codex-custom-v1',   // [{ id, label, data }]
};
const lsGet = (k, fallback) => {
  try {
    const v = localStorage.getItem(k);
    return v ? JSON.parse(v) : fallback;
  } catch { return fallback; }
};
const lsSet = (k, v) => {
  try { localStorage.setItem(k, JSON.stringify(v)); } catch {}
};

// -- Validation ------------------------------------------------------------
function validateCodex(data) {
  const errors = [];
  if (!data || typeof data !== 'object') return ['Not a valid JSON object'];
  if (!data.meta || typeof data.meta !== 'object') errors.push('Missing `meta` object');
  else if (!data.meta.title) errors.push('Missing `meta.title`');
  if (!Array.isArray(data.books)) errors.push('Missing `books` array');
  else data.books.forEach((b, i) => {
    if (typeof b.num !== 'number') errors.push(`books[${i}]: missing .num`);
    if (!b.title) errors.push(`books[${i}]: missing .title`);
    if (typeof b.chapters !== 'number') errors.push(`books[${i}]: missing .chapters`);
  });
  if (!data.categories || typeof data.categories !== 'object') errors.push('Missing `categories` object');
  if (!Array.isArray(data.entries)) errors.push('Missing `entries` array');
  else {
    const catKeys = Object.keys(data.categories || {});
    data.entries.forEach((e, i) => {
      if (!e.id) errors.push(`entries[${i}]: missing .id`);
      if (!e.name) errors.push(`entries[${i}]: missing .name`);
      if (!e.category) errors.push(`entries[${i}]: missing .category`);
      else if (catKeys.length && !catKeys.includes(e.category)) errors.push(`entries[${i}] "${e.name}": unknown category "${e.category}"`);
      if (typeof e.book !== 'number') errors.push(`entries[${i}] "${e.name}": missing .book`);
      if (typeof e.chapter !== 'number') errors.push(`entries[${i}] "${e.name}": missing .chapter`);
    });
  }
  return errors;
}

const SCHEMA_EXAMPLE = `{
  "meta": {
    "title": "Your Book Series",
    "author": "The Author",
    "series": "Series Name (optional)",
    "description": "Subtitle shown under the title (optional)"
  },
  "books": [
    { "num": 1, "title": "Book One Title", "chapters": 25 },
    { "num": 2, "title": "Book Two Title", "chapters": 30 }
  ],
  "categories": {
    "characters": { "label": "Dramatis Personae", "seal": "☥" },
    "places":     { "label": "Cartography",       "seal": "✦" },
    "items":      { "label": "Artefacts",         "seal": "❖" }
  },
  "entries": [
    {
      "id": "unique-slug",
      "category": "characters",
      "name": "Entry Name",
      "book": 1,
      "chapter": 3,
      "meta": "Short label (optional)",
      "desc": "Description shown in card and detail view.",
      "tags": ["optional", "tags"]
    }
  ]
}`;

// -- Main Component --------------------------------------------------------
function Codex() {
  // All codices available (bundled + any custom ones from localStorage)
  const [customCodices, setCustomCodices] = useState(() => lsGet(LS_KEYS.customCodices, []));
  const allCodices = useMemo(() => [...BUNDLED, ...customCodices], [customCodices]);

  // Active codex
  const [activeId, setActiveId] = useState(() => {
    const saved = lsGet(LS_KEYS.activeId, 'hp');
    return saved;
  });
  const activeCodex = useMemo(() => {
    const found = allCodices.find(c => c.id === activeId);
    return found ? found.data : HP_CODEX;
  }, [activeId, allCodices]);

  // Per-codex progress
  const [progressMap, setProgressMap] = useState(() => lsGet(LS_KEYS.progress, {}));
  const savedProgress = progressMap[activeId] || {};
  const [currentBook, setCurrentBook] = useState(() => savedProgress.book ?? activeCodex.books[0].num);
  const [currentChapter, setCurrentChapter] = useState(() => savedProgress.chapter ?? activeCodex.books[0].chapters);
  const [activeCategory, setActiveCategory] = useState(() => savedProgress.category ?? Object.keys(activeCodex.categories)[0]);

  // UI state
  const [search, setSearch] = useState('');
  const [selected, setSelected] = useState(null);
  const [showLibrary, setShowLibrary] = useState(false);
  const [showSchema, setShowSchema] = useState(false);
  const [uploadError, setUploadError] = useState(null);
  const [uploadSuccess, setUploadSuccess] = useState(null);
  const [dragActive, setDragActive] = useState(false);
  const fileInputRef = useRef(null);

  // When activeId changes, load its saved progress (or defaults)
  useEffect(() => {
    const p = progressMap[activeId];
    if (p && activeCodex.books.find(b => b.num === p.book)) {
      setCurrentBook(p.book);
      setCurrentChapter(p.chapter);
      if (activeCodex.categories[p.category]) setActiveCategory(p.category);
      else setActiveCategory(Object.keys(activeCodex.categories)[0]);
    } else {
      setCurrentBook(activeCodex.books[0].num);
      setCurrentChapter(activeCodex.books[0].chapters);
      setActiveCategory(Object.keys(activeCodex.categories)[0]);
    }
    setSearch('');
  // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [activeId]);

  // Persist active id
  useEffect(() => { lsSet(LS_KEYS.activeId, activeId); }, [activeId]);

  // Persist progress whenever it changes
  useEffect(() => {
    const updated = { ...progressMap, [activeId]: { book: currentBook, chapter: currentChapter, category: activeCategory } };
    setProgressMap(updated);
    lsSet(LS_KEYS.progress, updated);
  // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [activeId, currentBook, currentChapter, activeCategory]);

  // Persist custom codices
  useEffect(() => { lsSet(LS_KEYS.customCodices, customCodices); }, [customCodices]);

  const isUnlocked = (entry) => {
    if (entry.book < currentBook) return true;
    if (entry.book === currentBook && entry.chapter <= currentChapter) return true;
    return false;
  };

  const categoryKeys = Object.keys(activeCodex.categories || {});
  const currentBookObj = activeCodex.books.find(b => b.num === currentBook);

  const filtered = useMemo(() => {
    const q = search.toLowerCase().trim();
    return (activeCodex.entries || [])
      .filter(e => e.category === activeCategory)
      .filter(e => isUnlocked(e))
      .filter(e => !q || e.name.toLowerCase().includes(q) || (e.desc || '').toLowerCase().includes(q) || (e.meta || '').toLowerCase().includes(q))
      .sort((a, b) => a.book !== b.book ? a.book - b.book : a.chapter - b.chapter);
  }, [activeCodex, activeCategory, currentBook, currentChapter, search]);

  const totalUnlocked = (activeCodex.entries || []).filter(isUnlocked).length;
  const totalEntries = (activeCodex.entries || []).length;

  const loadCodexData = (data, label) => {
    const errors = validateCodex(data);
    if (errors.length > 0) {
      setUploadError(errors.slice(0, 5).join('\n') + (errors.length > 5 ? `\n...and ${errors.length - 5} more` : ''));
      setUploadSuccess(null);
      return false;
    }
    // Generate a custom id
    const newId = 'custom-' + Date.now();
    const entry = { id: newId, label: label || data.meta.title, data };
    setCustomCodices(prev => [...prev, entry]);
    setActiveId(newId);
    setUploadError(null);
    setUploadSuccess(`Loaded "${data.meta.title}" — ${data.entries.length} entries`);
    setTimeout(() => setUploadSuccess(null), 3000);
    setShowLibrary(false);
    return true;
  };

  const handleFile = (file) => {
    if (!file) return;
    if (!file.name.endsWith('.json')) {
      setUploadError('Please upload a .json file');
      return;
    }
    const reader = new FileReader();
    reader.onload = (e) => {
      try {
        const data = JSON.parse(e.target.result);
        loadCodexData(data);
      } catch (err) {
        setUploadError(`Invalid JSON: ${err.message}`);
        setUploadSuccess(null);
      }
    };
    reader.readAsText(file);
  };

  const exportCodex = () => {
    const blob = new Blob([JSON.stringify(activeCodex, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `${(activeCodex.meta.title || 'codex').toLowerCase().replace(/\s+/g, '-')}-codex.json`;
    a.click();
    URL.revokeObjectURL(url);
  };

  const handleDrop = (e) => {
    e.preventDefault();
    e.stopPropagation();
    setDragActive(false);
    const file = e.dataTransfer.files?.[0];
    handleFile(file);
  };

  const removeCustom = (id) => {
    if (!confirm('Remove this codex? Your progress for it will also be cleared.')) return;
    setCustomCodices(prev => prev.filter(c => c.id !== id));
    const newProg = { ...progressMap };
    delete newProg[id];
    setProgressMap(newProg);
    lsSet(LS_KEYS.progress, newProg);
    if (activeId === id) setActiveId('hp');
  };

  return (
    <div className="container">
      {/* Top bar */}
      <div className="topbar">
        <select
          className="btn btn-select"
          value={activeId}
          onChange={(e) => setActiveId(e.target.value)}
          title="Switch codex"
        >
          {allCodices.map(c => (
            <option key={c.id} value={c.id}>📚 {c.label}</option>
          ))}
        </select>
        <button className="btn" onClick={() => setShowLibrary(true)}>
          <Icon.Upload /> Load Codex
        </button>
        <button className="btn" onClick={exportCodex}>
          <Icon.Download /> Export
        </button>
      </div>

      {/* Header */}
      <header className="hero">
        <div className="divider-small">
          <span className="line"></span>
          Volumen Arcana
          <span className="line"></span>
        </div>
        <h1 className="title">THE CODEX</h1>
        <p className="subtitle">{activeCodex.meta?.description || 'A living bestiary, bound to the turning of pages'}</p>
        <div className="meta-line">
          {activeCodex.meta?.title}
          {activeCodex.meta?.author && <span className="author"> · {activeCodex.meta.author}</span>}
        </div>
      </header>

      {/* Chapter gate */}
      <section className="gate">
        <div className="gate-row">
          <div style={{ flex: 1 }}>
            <div className="gate-label">Currently reading</div>
            <div className="gate-line">
              <span className="book-label">Book {currentBook}</span>
              <span className="dot">·</span>
              <span className="book-title">{currentBookObj?.title}</span>
              <span className="dot">·</span>
              <span className="ch-label">Chapter {currentChapter}</span>
            </div>
          </div>
          <div className="gate-controls">
            <select
              className="gate-select"
              value={currentBook}
              onChange={(e) => {
                const newBook = Number(e.target.value);
                setCurrentBook(newBook);
                const b = activeCodex.books.find(x => x.num === newBook);
                if (b) setCurrentChapter(Math.min(currentChapter, b.chapters));
              }}
            >
              {activeCodex.books.map(b => (
                <option key={b.num} value={b.num}>Book {b.num}</option>
              ))}
            </select>
            <div className="ch-input-box">
              <span>Ch.</span>
              <input
                type="number"
                min="1"
                max={currentBookObj?.chapters || 100}
                value={currentChapter}
                onChange={(e) => setCurrentChapter(Math.max(1, Math.min(currentBookObj?.chapters || 100, Number(e.target.value) || 1)))}
              />
              <span className="slash">/ {currentBookObj?.chapters}</span>
            </div>
          </div>
        </div>
        <div className="progress-wrap">
          <div className="progress-labels">
            <span className="left">Codex unveiled</span>
            <span className="right">{totalUnlocked} / {totalEntries}</span>
          </div>
          <div className="progress-bar">
            <div
              className="progress-fill"
              style={{ width: `${totalEntries ? (totalUnlocked / totalEntries) * 100 : 0}%` }}
            />
          </div>
        </div>
      </section>

      <div className="main-grid">
        {/* Category nav */}
        <nav className="cat-nav">
          <div className="cat-nav-label">Chapters</div>
          <ul className="cat-list">
            {categoryKeys.map(key => {
              const cat = activeCodex.categories[key];
              const count = (activeCodex.entries || []).filter(e => e.category === key && isUnlocked(e)).length;
              const total = (activeCodex.entries || []).filter(e => e.category === key).length;
              const isActive = activeCategory === key;
              return (
                <li key={key}>
                  <button
                    onClick={() => setActiveCategory(key)}
                    className={`cat-btn ${isActive ? 'active' : ''}`}
                  >
                    <span className="cat-seal">{cat.seal || '✦'}</span>
                    <div className="cat-body">
                      <div className="cat-name">{cat.label}</div>
                      <div className="cat-count">{count} / {total}</div>
                    </div>
                    {isActive && <span className="cat-chevron">›</span>}
                  </button>
                </li>
              );
            })}
          </ul>
        </nav>

        {/* Main content */}
        <main>
          <div className="search-box">
            <Icon.Search />
            <input
              type="text"
              placeholder="Inquire within…"
              value={search}
              onChange={(e) => setSearch(e.target.value)}
            />
          </div>

          <div className="section-header">
            <h2 className="section-title">{activeCodex.categories[activeCategory]?.label}</h2>
            <div className="section-count">
              {filtered.length} {filtered.length === 1 ? 'entry' : 'entries'}
            </div>
          </div>

          {filtered.length === 0 ? (
            <div className="empty-state">
              <div className="glyph">✧</div>
              <p>No entries unveiled yet in this chapter.</p>
              <p className="hint">Read on, and they shall appear</p>
            </div>
          ) : (
            <div className="entry-grid">
              {filtered.map(entry => (
                <button
                  key={entry.id}
                  onClick={() => setSelected(entry)}
                  className="entry-card"
                >
                  <div className="entry-head">
                    <h3 className="entry-name">{entry.name}</h3>
                    <span className="entry-locator">B{entry.book}·{entry.chapter}</span>
                  </div>
                  {entry.meta && <div className="entry-meta">{entry.meta}</div>}
                  <p className="entry-desc">{entry.desc}</p>
                </button>
              ))}
            </div>
          )}

          {(activeCodex.entries || []).filter(e => e.category === activeCategory && !isUnlocked(e)).length > 0 && (
            <div className="locked">
              <div className="locked-head">
                <Icon.Lock />
                Yet to be revealed
              </div>
              <div className="locked-body">
                {(activeCodex.entries || []).filter(e => e.category === activeCategory && !isUnlocked(e)).length} entries await in chapters beyond.
              </div>
            </div>
          )}
        </main>
      </div>

      <footer className="page-footer">
        <p>{activeCodex.meta?.title}{activeCodex.meta?.author && ` · ${activeCodex.meta.author}`} · bound by the reader</p>
      </footer>

      {/* Entry detail modal */}
      {selected && (
        <div className="modal-backdrop" onClick={() => setSelected(null)}>
          <div className="modal" onClick={(e) => e.stopPropagation()}>
            <button className="modal-close" onClick={() => setSelected(null)} aria-label="Close">✕</button>
            <div className="modal-inner">
              <div className="modal-eyebrow">{activeCodex.categories[activeCategory]?.label}</div>
              <h2 className="modal-title">{selected.name}</h2>
              {selected.meta && <div className="modal-subtitle">{selected.meta}</div>}
              <div className="modal-rule" />
              <p className="modal-body">{selected.desc}</p>
              {selected.tags && selected.tags.length > 0 && (
                <div className="tag-row">
                  {selected.tags.map(tag => <span key={tag} className="tag">{tag}</span>)}
                </div>
              )}
              <div className="modal-footer">
                <span>First appeared</span>
                <span className="book-ch">Book {selected.book}, Chapter {selected.chapter}</span>
              </div>
            </div>
          </div>
        </div>
      )}

      {/* Library modal */}
      {showLibrary && (
        <div className="modal-backdrop" onClick={() => setShowLibrary(false)}>
          <div className="modal" onClick={(e) => e.stopPropagation()}>
            <button className="modal-close" onClick={() => setShowLibrary(false)} aria-label="Close">✕</button>
            <div className="modal-inner">
              <div className="modal-eyebrow">The Library</div>
              <h2 className="modal-title">Load a Codex</h2>
              <p style={{ color: 'rgba(245, 158, 11, 0.6)', fontStyle: 'italic', fontSize: '0.875rem', marginBottom: '1.5rem' }}>
                Drop a codex.json file, or choose from the library.
              </p>

              <div
                className={`dropzone ${dragActive ? 'active' : ''}`}
                onDragEnter={(e) => { e.preventDefault(); setDragActive(true); }}
                onDragLeave={(e) => { e.preventDefault(); setDragActive(false); }}
                onDragOver={(e) => e.preventDefault()}
                onDrop={handleDrop}
                onClick={() => fileInputRef.current?.click()}
              >
                <input
                  ref={fileInputRef}
                  type="file"
                  accept=".json,application/json"
                  style={{ display: 'none' }}
                  onChange={(e) => handleFile(e.target.files?.[0])}
                />
                <div className="up-icon"><Icon.Upload size={28} /></div>
                <div className="primary">Drop codex.json here</div>
                <div className="secondary">or click to browse</div>
              </div>

              {uploadError && (
                <div className="notice notice-error">
                  <Icon.Alert />
                  <pre>{uploadError}</pre>
                </div>
              )}
              {uploadSuccess && (
                <div className="notice notice-success">
                  <Icon.Check />
                  <div>{uploadSuccess}</div>
                </div>
              )}

              <div className="library-grid">
                {allCodices.map(c => (
                  <button
                    key={c.id}
                    className="library-card"
                    onClick={() => { setActiveId(c.id); setShowLibrary(false); }}
                    style={{ borderColor: c.id === activeId ? 'rgba(245, 158, 11, 0.8)' : undefined }}
                  >
                    <div className="eyebrow">
                      {BUNDLED.find(b => b.id === c.id) ? 'Bundled' : 'Custom'}
                    </div>
                    <div className="name">{c.label}</div>
                    <div className="sub">{c.data.entries.length} entries · {c.data.books.length} books</div>
                    {!BUNDLED.find(b => b.id === c.id) && (
                      <div
                        onClick={(e) => { e.stopPropagation(); removeCustom(c.id); }}
                        style={{ marginTop: '0.5rem', fontSize: '0.7rem', color: 'rgba(248, 113, 113, 0.7)', textDecoration: 'underline' }}
                      >
                        remove
                      </div>
                    )}
                  </button>
                ))}
                <button className="library-card" onClick={() => setShowSchema(true)}>
                  <div className="eyebrow">Reference</div>
                  <div className="name" style={{ display: 'flex', alignItems: 'center', gap: '0.5rem' }}>
                    <Icon.File /> JSON Schema
                  </div>
                  <div className="sub">Build your own</div>
                </button>
              </div>
            </div>
          </div>
        </div>
      )}

      {/* Schema modal */}
      {showSchema && (
        <div className="modal-backdrop" style={{ zIndex: 60 }} onClick={() => setShowSchema(false)}>
          <div className="modal" style={{ maxWidth: '48rem' }} onClick={(e) => e.stopPropagation()}>
            <button className="modal-close" onClick={() => setShowSchema(false)} aria-label="Close">✕</button>
            <div className="modal-inner">
              <div className="modal-eyebrow">Reference</div>
              <h2 className="modal-title">Codex JSON Schema</h2>
              <p style={{ color: 'rgba(253, 230, 138, 0.7)', marginBottom: '1rem' }}>
                Build your own codex for any book. Save as <code className="inline">codex.json</code> and drop it in.
              </p>
              <pre className="schema">{SCHEMA_EXAMPLE}</pre>
              <div style={{ marginTop: '1.5rem', display: 'flex', flexDirection: 'column', gap: '0.75rem', fontSize: '0.875rem', color: 'rgba(253, 230, 138, 0.7)' }}>
                <div><span style={{ color: 'rgba(252, 211, 77, 1)', fontFamily: "'Cinzel', serif" }}>meta</span> — titles and info displayed in the header.</div>
                <div><span style={{ color: 'rgba(252, 211, 77, 1)', fontFamily: "'Cinzel', serif" }}>books</span> — array of volumes in the series, with chapter counts.</div>
                <div><span style={{ color: 'rgba(252, 211, 77, 1)', fontFamily: "'Cinzel', serif" }}>categories</span> — fully customisable. Keys are arbitrary.</div>
                <div><span style={{ color: 'rgba(252, 211, 77, 1)', fontFamily: "'Cinzel', serif" }}>entries</span> — each references a <code className="inline">category</code> key. <code className="inline">book</code> + <code className="inline">chapter</code> determine when it unlocks.</div>
                <div style={{ paddingTop: '0.75rem', borderTop: '1px solid rgba(120, 53, 15, 0.3)', fontStyle: 'italic', color: 'rgba(217, 119, 6, 0.7)', fontSize: '0.75rem' }}>
                  Tip: ask Claude to generate a codex.json from your reading notes. Paste your notes, reference this schema, and it'll produce a valid file.
                </div>
              </div>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<Codex />);
</script>
</body>
</html>
