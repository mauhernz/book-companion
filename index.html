// ---------- Component ----------
function Codex() {
  const [customCodices, setCustomCodices] = useState(() => lsGet(LS.custom, []));
  const allCodices = useMemo(() => [...BUNDLED, ...customCodices], [customCodices]);

  const [activeId, setActiveId] = useState(() => lsGet(LS.activeId, 'hp'));
  const activeCodex = useMemo(() => {
    const found = allCodices.find(c => c.id === activeId);
    return found ? found.data : HP_CODEX;
  }, [activeId, allCodices]);

  const [progressMap, setProgressMap] = useState(() => lsGet(LS.progress, {}));
  const savedProgress = progressMap[activeId] || {};
  const [currentBook, setCurrentBook] = useState(() => savedProgress.book ?? activeCodex.books[0].num);
  const [currentChapter, setCurrentChapter] = useState(() => savedProgress.chapter ?? activeCodex.books[0].chapters);
  const [activeCategory, setActiveCategory] = useState(() => savedProgress.category ?? Object.keys(activeCodex.categories)[0]);

  // Theme: per-codex user override map { [codexId]: themeId }
  const [themeOverrides, setThemeOverrides] = useState(() => lsGet(LS.themeUser, {}));
  const codexDefaultTheme = activeCodex.meta?.theme && THEMES.find(t => t.id === activeCodex.meta.theme)
    ? activeCodex.meta.theme : 'parchment';
  const activeTheme = themeOverrides[activeId] || codexDefaultTheme;

  // UI state
  const [search, setSearch] = useState('');
  const [selected, setSelected] = useState(null);
  const [showLibrary, setShowLibrary] = useState(false);
  const [showSchema, setShowSchema] = useState(false);
  const [showThemes, setShowThemes] = useState(false);
  const [uploadError, setUploadError] = useState(null);
  const [uploadSuccess, setUploadSuccess] = useState(null);
  const [dragActive, setDragActive] = useState(false);
  const fileInputRef = useRef(null);

  // Apply theme to <html>
  useEffect(() => {
    document.documentElement.setAttribute('data-theme', activeTheme);
  }, [activeTheme]);

  // When activeId changes, load saved progress
  useEffect(() => {
    const p = progressMap[activeId];
    if (p && activeCodex.books.find(b => b.num === p.book)) {
      setCurrentBook(p.book);
      setCurrentChapter(p.chapter);
      if (activeCodex.categories[p.category]) setActiveCategory(p.category);
      else setActiveCategory(Object.keys(activeCodex.categories)[0]);
    } else {
      setCurrentBook(activeCodex.books[0].num);
      setCurrentChapter(activeCodex.books[0].chapters);
      setActiveCategory(Object.keys(activeCodex.categories)[0]);
    }
    setSearch('');
  // eslint-disable-next-line
  }, [activeId]);

  // Persist
  useEffect(() => { lsSet(LS.activeId, activeId); }, [activeId]);
  useEffect(() => {
    const updated = { ...progressMap, [activeId]: { book: currentBook, chapter: currentChapter, category: activeCategory } };
    setProgressMap(updated);
    lsSet(LS.progress, updated);
  // eslint-disable-next-line
  }, [activeId, currentBook, currentChapter, activeCategory]);
  useEffect(() => { lsSet(LS.custom, customCodices); }, [customCodices]);
  useEffect(() => { lsSet(LS.themeUser, themeOverrides); }, [themeOverrides]);

  const isUnlocked = (entry) => {
    if (entry.book < currentBook) return true;
    if (entry.book === currentBook && entry.chapter <= currentChapter) return true;
    return false;
  };

  const categoryKeys = Object.keys(activeCodex.categories || {});
  const currentBookObj = activeCodex.books.find(b => b.num === currentBook);

  const filtered = useMemo(() => {
    const q = search.toLowerCase().trim();
    return (activeCodex.entries || [])
      .filter(e => e.category === activeCategory)
      .filter(e => isUnlocked(e))
      .filter(e => !q || e.name.toLowerCase().includes(q) || (e.desc || '').toLowerCase().includes(q) || (e.meta || '').toLowerCase().includes(q))
      .sort((a, b) => a.book !== b.book ? a.book - b.book : a.chapter - b.chapter);
  // eslint-disable-next-line
  }, [activeCodex, activeCategory, currentBook, currentChapter, search]);

  const totalUnlocked = (activeCodex.entries || []).filter(isUnlocked).length;
  const totalEntries = (activeCodex.entries || []).length;

  const loadCodexData = (data) => {
    const errors = validateCodex(data);
    if (errors.length > 0) {
      setUploadError(errors.slice(0, 5).join('\n') + (errors.length > 5 ? `\n...and ${errors.length - 5} more` : ''));
      setUploadSuccess(null);
      return false;
    }
    const newId = 'custom-' + Date.now();
    setCustomCodices(prev => [...prev, { id: newId, label: data.meta.title, data }]);
    setActiveId(newId);
    setUploadError(null);
    setUploadSuccess(`Loaded "${data.meta.title}" — ${data.entries.length} entries`);
    setTimeout(() => setUploadSuccess(null), 3000);
    setShowLibrary(false);
    return true;
  };

  const handleFile = (file) => {
    if (!file) return;
    if (!file.name.endsWith('.json')) { setUploadError('Please upload a .json file'); return; }
    const reader = new FileReader();
    reader.onload = (e) => {
      try { loadCodexData(JSON.parse(e.target.result)); }
      catch (err) { setUploadError(`Invalid JSON: ${err.message}`); setUploadSuccess(null); }
    };
    reader.readAsText(file);
  };

  const exportCodex = () => {
    const blob = new Blob([JSON.stringify(activeCodex, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `${(activeCodex.meta.title || 'codex').toLowerCase().replace(/\s+/g, '-')}-codex.json`;
    a.click();
    URL.revokeObjectURL(url);
  };

  const handleDrop = (e) => {
    e.preventDefault(); e.stopPropagation();
    setDragActive(false);
    handleFile(e.dataTransfer.files?.[0]);
  };

  const removeCustom = (id) => {
    if (!confirm('Remove this codex? Your progress for it will also be cleared.')) return;
    setCustomCodices(prev => prev.filter(c => c.id !== id));
    const newProg = { ...progressMap };
    delete newProg[id];
    setProgressMap(newProg);
    lsSet(LS.progress, newProg);
    if (activeId === id) setActiveId('hp');
  };

  const setTheme = (themeId) => {
    setThemeOverrides(prev => ({ ...prev, [activeId]: themeId }));
  };
  const resetTheme = () => {
    setThemeOverrides(prev => {
      const next = { ...prev };
      delete next[activeId];
      return next;
    });
  };

  return (
    <div className="container">
      {/* Top bar */}
      <div className="topbar">
        <select className="btn btn-select" value={activeId} onChange={(e) => setActiveId(e.target.value)} title="Switch codex">
          {allCodices.map(c => <option key={c.id} value={c.id}>📚 {c.label}</option>)}
        </select>
        <button className="btn" onClick={() => setShowThemes(true)} title="Theme"><Icon.Palette /> Theme</button>
        <button className="btn" onClick={() => setShowLibrary(true)}><Icon.Upload /> Load Codex</button>
        <button className="btn" onClick={exportCodex}><Icon.Download /> Export</button>
      </div>

      {/* Header */}
      <header className="hero">
        <div className="divider-small">
          <span className="line"></span>
          <span className="eyebrow-text"></span>
          <span className="line"></span>
        </div>
        <h1 className="title">THE CODEX</h1>
        <p className="subtitle">{activeCodex.meta?.description || 'A living bestiary, bound to the turning of pages'}</p>
        <div className="meta-line">
          {activeCodex.meta?.title}
          {activeCodex.meta?.author && <span className="author"> · {activeCodex.meta.author}</span>}
        </div>
      </header>

      {/* Chapter gate */}
      <section className="gate">
        <div className="gate-row">
          <div style={{ flex: 1 }}>
            <div className="gate-label">Currently reading</div>
            <div className="gate-line">
              <span className="book-label">Book {currentBook}</span>
              <span className="dot">·</span>
              <span className="book-title">{currentBookObj?.title}</span>
              <span className="dot">·</span>
              <span className="ch-label">Chapter {currentChapter}</span>
            </div>
          </div>
          <div className="gate-controls">
            <select className="gate-select" value={currentBook} onChange={(e) => {
              const newBook = Number(e.target.value);
              setCurrentBook(newBook);
              const b = activeCodex.books.find(x => x.num === newBook);
              if (b) setCurrentChapter(Math.min(currentChapter, b.chapters));
            }}>
              {activeCodex.books.map(b => <option key={b.num} value={b.num}>Book {b.num}</option>)}
            </select>
            <div className="ch-input-box">
              <span>Ch.</span>
              <input type="number" min="1" max={currentBookObj?.chapters || 100} value={currentChapter}
                onChange={(e) => setCurrentChapter(Math.max(1, Math.min(currentBookObj?.chapters || 100, Number(e.target.value) || 1)))}
              />
              <span className="slash">/ {currentBookObj?.chapters}</span>
            </div>
          </div>
        </div>
        <div className="progress-wrap">
          <div className="progress-labels">
            <span className="left">Codex unveiled</span>
            <span className="right">{totalUnlocked} / {totalEntries}</span>
          </div>
          <div className="progress-bar">
            <div className="progress-fill" style={{ width: `${totalEntries ? (totalUnlocked / totalEntries) * 100 : 0}%` }} />
          </div>
        </div>
      </section>

      <div className="main-grid">
        <nav className="cat-nav">
          <div className="cat-nav-label">Chapters</div>
          <ul className="cat-list">
            {categoryKeys.map(key => {
              const cat = activeCodex.categories[key];
              const count = (activeCodex.entries || []).filter(e => e.category === key && isUnlocked(e)).length;
              const total = (activeCodex.entries || []).filter(e => e.category === key).length;
              const isActive = activeCategory === key;
              return (
                <li key={key}>
                  <button onClick={() => setActiveCategory(key)} className={`cat-btn ${isActive ? 'active' : ''}`}>
                    <span className="cat-seal">{cat.seal || '✦'}</span>
                    <div className="cat-body">
                      <div className="cat-name">{cat.label}</div>
                      <div className="cat-count">{count} / {total}</div>
                    </div>
                    {isActive && <span className="cat-chevron">›</span>}
                  </button>
                </li>
              );
            })}
          </ul>
        </nav>

        <main>
          <div className="search-box">
            <Icon.Search />
            <input type="text" placeholder="Inquire within…" value={search} onChange={(e) => setSearch(e.target.value)} />
          </div>

          <div className="section-header">
            <h2 className="section-title">{activeCodex.categories[activeCategory]?.label}</h2>
            <div className="section-count">{filtered.length} {filtered.length === 1 ? 'entry' : 'entries'}</div>
          </div>

          {filtered.length === 0 ? (
            <div className="empty-state">
              <div className="glyph">✧</div>
              <p>No entries unveiled yet in this chapter.</p>
              <p className="hint">Read on, and they shall appear</p>
            </div>
          ) : (
            <div className="entry-grid">
              {filtered.map(entry => (
                <button key={entry.id} onClick={() => setSelected(entry)} className="entry-card">
                  <div className="entry-head">
                    <h3 className="entry-name">{entry.name}</h3>
                    <span className="entry-locator">B{entry.book}·{entry.chapter}</span>
                  </div>
                  {entry.meta && <div className="entry-meta">{entry.meta}</div>}
                  <p className="entry-desc">{entry.desc}</p>
                </button>
              ))}
            </div>
          )}

          {(activeCodex.entries || []).filter(e => e.category === activeCategory && !isUnlocked(e)).length > 0 && (
            <div className="locked">
              <div className="locked-head"><Icon.Lock /> Yet to be revealed</div>
              <div className="locked-body">
                {(activeCodex.entries || []).filter(e => e.category === activeCategory && !isUnlocked(e)).length} entries await in chapters beyond.
              </div>
            </div>
          )}
        </main>
      </div>

      <footer className="page-footer">
        <p>{activeCodex.meta?.title}{activeCodex.meta?.author && ` · ${activeCodex.meta.author}`} · bound by the reader</p>
      </footer>

      {/* Entry detail modal */}
      {selected && (
        <div className="modal-backdrop" onClick={() => setSelected(null)}>
          <div className="modal" onClick={(e) => e.stopPropagation()}>
            <button className="modal-close" onClick={() => setSelected(null)} aria-label="Close">✕</button>
            <div className="modal-inner">
              <div className="modal-eyebrow">{activeCodex.categories[activeCategory]?.label}</div>
              <h2 className="modal-title">{selected.name}</h2>
              {selected.meta && <div className="modal-subtitle">{selected.meta}</div>}
              <div className="modal-rule" />
              <p className="modal-body">{selected.desc}</p>
              {selected.tags && selected.tags.length > 0 && (
                <div className="tag-row">
                  {selected.tags.map(tag => <span key={tag} className="tag">{tag}</span>)}
                </div>
              )}
              <div className="modal-footer">
                <span>First appeared</span>
                <span className="book-ch">Book {selected.book}, Chapter {selected.chapter}</span>
              </div>
            </div>
          </div>
        </div>
      )}

      {/* Library modal */}
      {showLibrary && (
        <div className="modal-backdrop" onClick={() => setShowLibrary(false)}>
          <div className="modal" onClick={(e) => e.stopPropagation()}>
            <button className="modal-close" onClick={() => setShowLibrary(false)} aria-label="Close">✕</button>
            <div className="modal-inner">
              <div className="modal-eyebrow">The Library</div>
              <h2 className="modal-title">Load a Codex</h2>
              <p style={{ color: 'var(--fg-muted)', fontStyle: 'italic', fontSize: '0.875rem', marginBottom: '1.5rem' }}>
                Drop a codex.json file, or choose from the library.
              </p>

              <div
                className={`dropzone ${dragActive ? 'active' : ''}`}
                onDragEnter={(e) => { e.preventDefault(); setDragActive(true); }}
                onDragLeave={(e) => { e.preventDefault(); setDragActive(false); }}
                onDragOver={(e) => e.preventDefault()}
                onDrop={handleDrop}
                onClick={() => fileInputRef.current?.click()}
              >
                <input ref={fileInputRef} type="file" accept=".json,application/json" style={{ display: 'none' }} onChange={(e) => handleFile(e.target.files?.[0])} />
                <div className="up-icon"><Icon.Upload size={28} /></div>
                <div className="primary">Drop codex.json here</div>
                <div className="secondary">or click to browse</div>
              </div>

              {uploadError && (
                <div className="notice notice-error">
                  <Icon.Alert />
                  <pre>{uploadError}</pre>
                </div>
              )}
              {uploadSuccess && (
                <div className="notice notice-success">
                  <Icon.Check />
                  <div>{uploadSuccess}</div>
                </div>
              )}

              <div className="library-grid">
                {allCodices.map(c => (
                  <button key={c.id} className="library-card" onClick={() => { setActiveId(c.id); setShowLibrary(false); }}
                    style={{ borderColor: c.id === activeId ? 'var(--accent)' : undefined }}>
                    <div className="eyebrow">{BUNDLED.find(b => b.id === c.id) ? 'Bundled' : 'Custom'}</div>
                    <div className="name">{c.label}</div>
                    <div className="sub">{c.data.entries.length} entries · {c.data.books.length} {c.data.books.length === 1 ? 'book' : 'books'}</div>

                      <div onClick={(e) => { e.stopPropagation(); removeCustom(c.id); }}

                        remove

                  <div className="eyebrow">Reference</div>
                  <div className="name" style={{ display: 'flex', alignItems: 'center', gap: '0.5rem' }}>
                    <Icon.File /> JSON Schema
                  </div>
                  <div className="sub">Build your own</div>
                </button>
              </div>
            </div>
          </div>
        </div>
      )}

      {/* Theme picker */}
      {showThemes && (
        <div className="modal-backdrop" onClick={() => setShowThemes(false)}>
          <div className="modal" onClick={(e) => e.stopPropagation()}>
            <button className="modal-close" onClick={() => setShowThemes(false)} aria-label="Close">✕</button>

              <div className="modal-eyebrow">Visual Style</div>
              <h2 className="modal-title">Themes</h2>
              <p style={{ color: 'var(--fg-muted)', fontStyle: 'italic', fontSize: '0.875rem', marginBottom: '0.5rem' }}>
                Choose a visual style for "{activeCodex.meta.title}". Each codex remembers its own choice.
              </p>
              <div style={{ fontSize: '0.75rem', color: 'var(--fg-muted)', marginBottom: '1rem' }}>
                Default for this codex: <span style={{ color: 'var(--accent)' }}>{THEMES.find(t => t.id === codexDefaultTheme)?.name}</span>
                {themeOverrides[activeId] && (
                  <button onClick={resetTheme} className="btn" style={{ marginLeft: '0.75rem', padding: '0.25rem 0.625rem', fontSize: '0.7rem' }}>
                    Reset to default
                  </button>
                )}
              </div>
              <div className="theme-grid">
                {THEMES.map(t => (
                  <button key={t.id} className={`theme-card ${activeTheme === t.id ? 'active' : ''}`} onClick={() => setTheme(t.id)}>
                    {activeTheme === t.id && <span className="check">✓</span>}
                    <div className="theme-swatch" style={{ background: THEME_SWATCHES[t.id] }} />
                    <div className="theme-name">{t.name}</div>
                    <div className="theme-desc">{t.desc}</div>
                  </button>
                ))}
              </div>
            </div>
          </div>
        </div>
      )}

      {/* Schema modal */}
      {showSchema && (
        <div className="modal-backdrop" style={{ zIndex: 60 }} onClick={() => setShowSchema(false)}>
          <div className="modal" style={{ maxWidth: '48rem' }} onClick={(e) => e.stopPropagation()}>
            <button className="modal-close" onClick={() => setShowSchema(false)} aria-label="Close">✕</button>
            <div className="modal-inner">
              <div className="modal-eyebrow">Reference</div>
              <h2 className="modal-title">Codex JSON Schema</h2>
              <p style={{ color: 'var(--fg-soft)', marginBottom: '1rem' }}>
                Build your own codex for any book. Save as <code className="inline">codex.json</code> and drop it in.
              </p>
              <pre className="schema">{SCHEMA_EXAMPLE}</pre>
              <div style={{ marginTop: '1.5rem', display: 'flex', flexDirection: 'column', gap: '0.75rem', fontSize: '0.875rem', color: 'var(--fg-soft)' }}>
                <div><span style={{ color: 'var(--accent-bright)', fontFamily: 'var(--display-font)' }}>meta.theme</span> — optional. Sets the visual default for this codex (one of the six theme ids). User can override.</div>
                <div><span style={{ color: 'var(--accent-bright)', fontFamily: 'var(--display-font)' }}>books</span> — array of volumes with chapter counts.</div>
                <div><span style={{ color: 'var(--accent-bright)', fontFamily: 'var(--display-font)' }}>categories</span> — fully customisable. Keys are arbitrary.</div>
                <div><span style={{ color: 'var(--accent-bright)', fontFamily: 'var(--display-font)' }}>entries</span> — each references a <code className="inline">category</code> key. <code className="inline">book</code> + <code className="inline">chapter</code> determine when it unlocks.</div>
                <div style={{ paddingTop: '0.75rem', borderTop: '1px solid var(--rule)', fontStyle: 'italic', color: 'var(--fg-muted)', fontSize: '0.75rem' }}>
                  Tip: ask Claude to generate a codex.json from your reading notes. Paste the EPUB or your notes, reference this schema, and ask for the file.
                </div>
              </div>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<Codex />);

</script>
</body>
</html>
