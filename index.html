/* ==========================================================================

* { box-sizing: border-box; }
html, body {
  margin: 0; padding: 0; min-height: 100vh;
  background-color: var(--bg);
  color: var(--fg);
  font-family: var(--body-font);
  transition: background-color 0.6s, color 0.6s;
}
#root { min-height: 100vh; }

.bg-layer-1 {
  position: fixed; inset: 0; pointer-events: none; z-index: 0;
  background: var(--bg-layer-1);
  transition: background 0.6s;
}
.bg-layer-2 {
  position: fixed; inset: 0; pointer-events: none; z-index: 0;
  opacity: var(--bg-layer-2-opacity);
  mix-blend-mode: var(--bg-layer-2-blend);
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");

.container { position: relative; z-index: 1; max-width: 80rem; margin: 0 auto; padding: 2.5rem 1.5rem; }

.topbar { display: flex; justify-content: flex-end; gap: 0.5rem; margin-bottom: 1.5rem; flex-wrap: wrap; align-items: center; }

.btn:hover { border-color: var(--hover); color: var(--fg); }

  text-shadow: var(--title-glow);

.search-box { position: relative; margin-bottom: 1.5rem; }

  transition: border-color 0.3s, background 0.6s;
}
.entry-card:hover { border-color: var(--hover); }

  content: ''; position: absolute; inset: 0;
  background: radial-gradient(circle at top right, var(--rule-strong), transparent 70%);

.locked { margin-top: 2.5rem; padding-top: 1.5rem; border-top: 1px solid var(--rule); }
.locked-head { display: flex; align-items: center; gap: 0.5rem; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.3em; color: var(--fg-muted); margin-bottom: 0.75rem; }
.locked-body { font-size: 0.875rem; color: var(--fg-muted); font-style: italic; opacity: 0.85; }

footer.page-footer {
  margin-top: 4rem; padding-top: 2rem; border-top: 1px solid var(--rule);
  text-align: center; font-size: 0.75rem; color: var(--fg-muted);
  letter-spacing: 0.1em; text-transform: uppercase;
}

/* Modals */
.modal-backdrop {
  position: fixed; inset: 0; z-index: 50;
  display: flex; align-items: center; justify-content: center;
  padding: 1.5rem;
  background: rgba(10, 7, 4, 0.8);
  backdrop-filter: blur(6px);
}
.modal {
  position: relative; max-width: 42rem; width: 100%;
  border-radius: 0.5rem; overflow: hidden;
  background: var(--bg-modal);
  border: 1px solid var(--rule-strong);
  box-shadow: 0 20px 60px rgba(0,0,0,0.8), inset 0 1px 0 rgba(255, 255, 255, 0.05);
  max-height: 85vh;
  display: flex; flex-direction: column;
}
.modal-close {
  position: absolute; top: 1rem; right: 1rem;
  background: transparent; border: none; cursor: pointer;
  color: var(--fg-muted); z-index: 10;
  font-size: 1.25rem; line-height: 1;
  padding: 0.25rem 0.5rem; font-family: inherit;
}
.modal-close:hover { color: var(--accent-bright); }
.modal-inner { padding: 2rem; overflow-y: auto; }
.modal-eyebrow { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.3em; color: var(--fg-muted); margin-bottom: 0.5rem; }
.modal-title { font-family: var(--display-font); letter-spacing: 0.05em; font-size: 1.875rem; color: var(--fg); margin: 0 0 0.5rem 0; font-weight: var(--display-weight); }
.modal-subtitle { font-style: italic; color: var(--accent); margin-bottom: 1rem; }
.modal-rule { height: 1px; background: linear-gradient(to right, transparent, var(--rule-strong), transparent); margin: 1.25rem 0; }
.modal-body { font-size: 1.125rem; line-height: 1.7; color: var(--fg-soft); font-family: var(--body-font); }
.tag-row { margin-top: 1.5rem; display: flex; flex-wrap: wrap; gap: 0.5rem; }
.tag { font-size: 0.75rem; padding: 0.25rem 0.75rem; border-radius: 9999px; border: 1px solid var(--rule-strong); color: var(--accent); letter-spacing: 0.025em; opacity: 0.85; }
.modal-footer { margin-top: 1.5rem; padding-top: 1rem; border-top: 1px solid var(--rule); display: flex; align-items: center; justify-content: space-between; font-size: 0.75rem; color: var(--fg-muted); }
.modal-footer .book-ch { font-family: var(--display-font); color: var(--accent-bright); }

/* Drop zone */
.dropzone {
  border: 2px dashed var(--rule-strong);
  border-radius: 0.5rem; padding: 2.5rem;
  text-align: center; cursor: pointer;
  transition: all 0.2s;
}
.dropzone:hover { border-color: var(--hover); background: var(--bg-elev); }
.dropzone.active { border-color: var(--accent); background: var(--bg-elev); }
.dropzone .up-icon { font-size: 1.75rem; color: var(--fg-muted); margin-bottom: 0.75rem; }
.dropzone .primary { color: var(--fg); margin-bottom: 0.25rem; font-family: var(--display-font); }
.dropzone .secondary { font-size: 0.75rem; color: var(--fg-muted); }

.notice { margin-top: 1rem; padding: 1rem; border-radius: 0.25rem; display: flex; gap: 0.75rem; font-size: 0.875rem; }
.notice-error { background: rgba(69, 10, 10, 0.4); border: 1px solid rgba(153, 27, 27, 0.5); color: rgba(254, 202, 202, 0.9); }
.notice-error pre { white-space: pre-wrap; font-family: ui-monospace, monospace; font-size: 0.75rem; margin: 0; }
.notice-success { background: rgba(6, 78, 59, 0.4); border: 1px solid rgba(6, 95, 70, 0.5); color: rgba(167, 243, 208, 0.9); }

.library-grid { margin-top: 1.5rem; display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; }
.library-card {
  padding: 1rem; border-radius: 0.25rem; text-align: left;
  background: var(--bg-elev);
  border: 1px solid var(--rule);
  cursor: pointer;
  transition: border-color 0.15s;
  font-family: inherit; color: inherit;
}
.library-card:hover { border-color: var(--hover); }
.library-card .eyebrow { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.2em; color: var(--fg-muted); margin-bottom: 0.25rem; }
.library-card .name { font-family: var(--display-font); color: var(--fg); font-size: 1rem; }
.library-card .sub { font-size: 0.75rem; color: var(--fg-muted); margin-top: 0.25rem; }

/* Theme picker */
.theme-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; margin-top: 1rem; }
@media (min-width: 480px) { .theme-grid { grid-template-columns: 1fr 1fr 1fr; } }
.theme-card {
  padding: 0.875rem; border-radius: 0.375rem; cursor: pointer;
  border: 1px solid var(--rule);
  background: var(--bg-elev);
  text-align: left;
  font-family: inherit; color: inherit;
  transition: border-color 0.15s, transform 0.15s;
  position: relative;
}
.theme-card:hover { border-color: var(--hover); transform: translateY(-1px); }
.theme-card.active { border-color: var(--accent); }
.theme-swatch {
  height: 40px; border-radius: 0.25rem; margin-bottom: 0.5rem;
  position: relative; overflow: hidden;
}
.theme-name { font-family: var(--display-font); font-size: 0.95rem; color: var(--fg); }
.theme-desc { font-size: 0.7rem; color: var(--fg-muted); margin-top: 0.125rem; line-height: 1.4; font-style: italic; }
.theme-card .check {
  position: absolute; top: 0.5rem; right: 0.5rem;
  font-size: 0.75rem; color: var(--accent-bright);
}

/* Schema block */
pre.schema {
  background: rgba(0, 0, 0, 0.4);
  border: 1px solid var(--rule);
  border-radius: 0.25rem;
  padding: 1rem; overflow-x: auto;
  font-size: 0.75rem; color: var(--fg-soft);
  font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
  line-height: 1.6; white-space: pre; margin: 0;
}
code.inline {
  color: var(--accent-bright);
  background: var(--bg-elev);
  padding: 0.125rem 0.375rem;
  border-radius: 0.25rem;
  font-family: ui-monospace, monospace;
  font-size: 0.875em;
}

</style>
