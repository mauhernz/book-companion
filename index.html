s","name":"Kredik Shaw","book":1,"chapter":1,"meta":"Palace","desc":"The Hill of a Thousand Spires. The Lord Ruler's black palace.","tags":["luthadel"]},{"id":"venture-keep","category":"places","name":"Venture Keep","book":1,"chapter":7,"meta":"Luthadel","desc":"Stronghold of House Venture. Host of Vin's first noble ball.","tags":["luthadel","nobility"]},{"id":"clubs-shop","category":"places","name":"Clubs's Shop","book":1,"chapter":4,"meta":"Luthadel","desc":"A carpenter's shop. The crew's safehouse. Smoked against Seekers.","tags":["crew","luthadel"]},{"id":"hathsin","category":"places","name":"The Pits of Hathsin","book":1,"chapter":1,"meta":"Mines","desc":"Underground prison-mines where the Lord Ruler's atium is harvested. Kelsier escaped them.","tags":["mines"]},{"id":"central-dominance","category":"places","name":"The Central Dominance","book":1,"chapter":1,"meta":"Region","desc":"The heart of the Final Empire. Luthadel sits at its centre.","tags":["dominance"]},{"id":"terris","category":"places","name":"Terris","book":1,"chapter":6,"meta":"Northern region","desc":"Homeland of the Terrismen. Once proud, now a breeding program managed by the Empire.","tags":["dominance"]},{"id":"fadrex","category":"places","name":"Fadrex City","book":3,"chapter":21,"meta":"Western Dominance","desc":"A city ringed by natural rock spires. Seat of the Canton of Resource.","tags":["dominance"]},{"id":"urteau","category":"places","name":"Urteau","book":2,"chapter":16,"meta":"Northern Dominance","desc":"City of canals — long since dried out. Seat of the old House Venture.","tags":["dominance"]},{"id":"canton-orthodoxy","category":"places","name":"Canton of Orthodoxy","book":1,"chapter":2,"meta":"Steel Ministry","desc":"Chief branch of the Steel Ministry. Keepers of doctrine.","tags":["ministry"]},{"id":"canton-inquisition","category":"places","name":"Canton of Inquisition","book":1,"chapter":5,"meta":"Steel Ministry","desc":"Branch of the Ministry that births Steel Inquisitors.","tags":["ministry"]},{"id":"tathingdwen","category":"places","name":"Tathingdwen","book":3,"chapter":26,"meta":"Terris capital","desc":"The capital of the Terris Dominance. Destroyed in the gathering dark.","tags":["dominance"]},{"id":"homeland","category":"places","name":"The Kandra Homeland","book":3,"chapter":19,"meta":"Hidden","desc":"A secret kandra refuge beneath the mountains. Guarded by the First Contract.","tags":["kandra"]},{"id":"conventical","category":"places","name":"Conventical of Seran","book":2,"chapter":19,"meta":"Inquisitor stronghold","desc":"An imposing Inquisitor fortress on the Southern coast. Holds dark secrets of the Ministry.","tags":["ministry"]},{"id":"well-location","category":"places","name":"The Well of Ascension","book":2,"chapter":1,"meta":"Mythic site","desc":"A legendary pool of divine power said to return once every thousand years. Location — once lost.","tags":["mythic"]},{"id":"iron","category":"allomancy","name":"Iron — Pulling metals","book":1,"chapter":1,"meta":"External physical","desc":"Burning iron lets an Allomancer pull on nearby metal sources. Coinshots use it to anchor themselves.","tags":["physical","basic-8"]},{"id":"steel","category":"allomancy","name":"Steel — Pushing metals","book":1,"chapter":8,"meta":"External physical","desc":"Burning steel lets an Allomancer push on nearby metal. The signature skill of Coinshots and Mistborn flight.","tags":["physical","basic-8"]},{"id":"pewter","category":"allomancy","name":"Pewter — Physical enhancement","book":1,"chapter":8,"meta":"Internal physical","desc":"Burning pewter enhances strength, balance, and stamina. Pewterarms are storms in close combat.","tags":["physical","basic-8"]},{"id":"tin","category":"allomancy","name":"Tin — Sense enhancement","book":1,"chapter":8,"meta":"Internal physical","desc":"Burning tin sharpens all senses to painful acuity. Tineyes watch from rooftops for miles.","tags":["physical","basic-8"]},{"id":"zinc","category":"allomancy","name":"Zinc — Rioting emotions","book":1,"chapter":11,"meta":"External mental","desc":"Burning zinc inflames the emotions of others. Rioters nudge crowds toward fury.","tags":["mental","basic-8"]},{"id":"brass","category":"allomancy","name":"Brass — Soothing emotions","book":1,"chapter":11,"meta":"External mental","desc":"Burning brass dampens the emotions of others. Soothers make dangerous conversations pleasant.","tags":["mental","basic-8"]},{"id":"copper","category":"allomancy","name":"Copper — Hiding Allomancy","book":1,"chapter":11,"meta":"Internal mental","desc":"Burning copper hides Allomantic pulses from Seekers. Smokers shelter entire crews.","tags":["mental","basic-8"]},{"id":"bronze","category":"allomancy","name":"Bronze — Seeking Allomancy","book":1,"chapter":11,"meta":"Internal mental","desc":"Burning bronze reveals other Allomancers' pulses. The Inquisitor's sense.","tags":["mental","basic-8"]},{"id":"atium","category":"allomancy","name":"Atium — Seeing the future","book":1,"chapter":11,"meta":"Temporal / Godmetal","desc":"Burning atium lets an Allomancer see seconds into the future. The Lord Ruler's tightly-hoarded secret.","tags":["godmetal","rare"]},{"id":"eleventh-metal","category":"allomancy","name":"The Eleventh Metal","book":1,"chapter":4,"meta":"Mystery","desc":"Kelsier claims a secret metal exists that can kill the Lord Ruler. None have heard of it.","tags":["mystery"]},{"id":"duralumin","category":"allomancy","name":"Duralumin — Enhancement","book":2,"chapter":30,"meta":"Enhancement","desc":"Burning duralumin amplifies whatever metal is burning with it into a single massive flare.","tags":["enhancement"]},{"id":"aluminum","category":"allomancy","name":"Aluminum — Metal vacuum","book":2,"chapter":30,"meta":"Enhancement","desc":"Burning aluminum consumes all the burner's other metal reserves. Shields against Allomantic influence.","tags":["enhancement"]},{"id":"cadmium","category":"allomancy","name":"Cadmium — Slowing time","book":3,"chapter":24,"meta":"Temporal","desc":"Burning cadmium creates a bubble where time slows for those outside.","tags":["temporal"]},{"id":"bendalloy","category":"allomancy","name":"Bendalloy — Speeding time","book":3,"chapter":24,"meta":"Temporal","desc":"Burning bendalloy creates a bubble where time passes faster inside than out.","tags":["temporal"]},{"id":"nicrosil","category":"allomancy","name":"Nicrosil — Flaring another's metals","book":3,"chapter":24,"meta":"Enhancement","desc":"Burning nicrosil while touching another Allomancer flares all the metals they are burning.","tags":["enhancement"]},{"id":"chromium","category":"allomancy","name":"Chromium — Wiping metals","book":3,"chapter":24,"meta":"Enhancement","desc":"Burning chromium while touching another Allomancer wipes all their metal reserves.","tags":["enhancement"]},{"id":"lerasium","category":"allomancy","name":"Lerasium","book":3,"chapter":58,"meta":"Godmetal","desc":"A godmetal that grants full Mistborn powers to any who burn it. Almost wholly consumed a thousand years ago.","tags":["godmetal"]},{"id":"mistborn-def","category":"allomancy","name":"Mistborn","book":1,"chapter":8,"meta":"Allomancer type","desc":"One who can burn all Allomantic metals. Rare — usually born only into powerful noble lines.","tags":["type"]},{"id":"misting-def","category":"allomancy","name":"Mistings","book":1,"chapter":11,"meta":"Allomancer type","desc":"Allomancers who can burn only one metal each. Named by their metal: Thug, Coinshot, Soother, Rioter, etc.","tags":["type"]},{"id":"feruchemy-def","category":"feruchemy","name":"Feruchemy — The Terris Art","book":1,"chapter":6,"meta":"Magic system","desc":"Terris art of storing personal attributes in metal now and drawing them out later. A trade, never free.","tags":["system"]},{"id":"keepers","category":"feruchemy","name":"Keepers of Terris","book":1,"chapter":6,"meta":"Order","desc":"A secret Terris order who preserve knowledge in copper metalminds against the Lord Ruler's purges.","tags":["order"]},{"id":"feru-copper","category":"feruchemy","name":"Copperminds — Memory","book":1,"chapter":6,"meta":"Mental","desc":"Store memories perfectly. Sazed's libraries-in-metal.","tags":["mental"]},{"id":"feru-pewter","category":"feruchemy","name":"Pewterminds — Strength","book":2,"chapter":1,"meta":"Physical","desc":"Store physical strength. Draw on it later to briefly become a titan.","tags":["physical"]},{"id":"feru-tin","category":"feruchemy","name":"Tinminds — Senses","book":2,"chapter":1,"meta":"Physical","desc":"Store the acuity of a single sense. Store sight in darkness, regain it at will.","tags":["physical"]},{"id":"feru-steel","category":"feruchemy","name":"Steelminds — Speed","book":2,"chapter":1,"meta":"Physical","desc":"Store physical speed. Used by Terris messengers and warriors.","tags":["physical"]},{"id":"feru-iron","category":"feruchemy","name":"Ironminds — Weight","book":3,"chapter":10,"meta":"Physical","desc":"Store physical weight. Become feather-light or an immovable anchor.","tags":["physical"]},{"id":"feru-brass","category":"feruchemy","name":"Brassminds — Warmth","book":3,"chapter":10,"meta":"Physical","desc":"Store body heat. Endure cold or radiate it later.","tags":["physical"]},{"id":"feru-zinc","category":"feruchemy","name":"Zincminds — Mental speed","book":3,"chapter":10,"meta":"Mental","desc":"Store mental speed. Think faster, or duller, as required.","tags":["mental"]},{"id":"feru-bronze","category":"feruchemy","name":"Bronzeminds — Wakefulness","book":3,"chapter":10,"meta":"Mental","desc":"Store wakefulness. Sleep now to stay alert for days later.","tags":["mental"]},{"id":"feru-gold","category":"feruchemy","name":"Goldminds — Health","book":3,"chapter":10,"meta":"Hybrid","desc":"Store health. Heal wounds by drawing on a stored reserve of vitality.","tags":["hybrid"]},{"id":"feru-atium","category":"feruchemy","name":"Atiumminds — Age","book":3,"chapter":42,"meta":"Godmetal","desc":"Store youth. Grow old rapidly now, regain years later. The Lord Ruler's hidden cheat.","tags":["godmetal"]},{"id":"hemalurgy-def","category":"hemalurgy","name":"Hemalurgy — Stealing powers","book":3,"chapter":17,"meta":"Magic system","desc":"The Lord Ruler's dark third art: drive a metal spike through one person into another, and power transfers. Pays a cruel price.","tags":["system"]},{"id":"inquisitor-spikes","category":"hemalurgy","name":"Inquisitor Spikes","book":3,"chapter":17,"meta":"Ritual","desc":"Steel spikes through the eyes grant Inquisitors Allomantic powers — and a tether to a greater will.","tags":["spikes"]},{"id":"koloss-spikes","category":"hemalurgy","name":"Koloss Creation","book":3,"chapter":22,"meta":"Horror","desc":"Bronze spikes twist men into koloss — growing ever larger, ever madder, until the skin splits.","tags":["spikes"]},{"id":"kandra-spikes","category":"hemalurgy","name":"Kandra Spikes","book":3,"chapter":38,"meta":"Secret","desc":"Kandra, too, are created by Hemalurgy — two small spikes that grant them their Blessings.","tags":["spikes","kandra"]},{"id":"atium-item","category":"items","name":"Atium (the substance)","book":1,"chapter":1,"meta":"Godmetal","desc":"Small silvery beads — the most precious substance in the Final Empire. Mined only at Hathsin.","tags":["godmetal"]},{"id":"boxings","category":"items","name":"Boxings","book":1,"chapter":1,"meta":"Currency","desc":"Gold coins of the Final Empire. Also — conveniently — throwing ammunition for Coinshots.","tags":["money"]},{"id":"mistcloak","category":"items","name":"Mistcloak","book":1,"chapter":8,"meta":"Garment","desc":"A tasseled cloak worn by Mistborn. Part practical, part swaggering statement.","tags":["garment"]},{"id":"obsidian-daggers","category":"items","name":"Obsidian Daggers","book":1,"chapter":8,"meta":"Weapon","desc":"The weapon of choice for Mistborn — metal is a liability against other Allomancers.","tags":["weapon"]},{"id":"coin-pouch","category":"items","name":"Coin Pouch","book":1,"chapter":8,"meta":"Tool","desc":"Every Coinshot's bandolier. A steel-pusher's ammunition and anchor in one.","tags":["tool"]},{"id":"lord-ruler-log","category":"items","name":"The Lord Ruler's Logbook","book":1,"chapter":7,"meta":"Journal","desc":"An old travel journal — supposedly written by the Hero before his Ascension.","tags":["document"]},{"id":"kandra-contract","category":"items","name":"The Contract","book":2,"chapter":36,"meta":"Kandra law","desc":"The sacred agreement that binds kandra to their human masters. Older than any kandra now living.","tags":["kandra"]},{"id":"steel-inquisitor-axes","category":"items","name":"Obsidian Axes","book":1,"chapter":35,"meta":"Weapon","desc":"Massive obsidian axes wielded by Steel Inquisitors — light as air to a pewter-dragging monster.","tags":["weapon"]},{"id":"bands-of-mourning-ref","category":"items","name":"Rashek's Earring","book":2,"chapter":40,"meta":"Artifact","desc":"A small metal earring Vin has worn since childhood. Her mother gave it to her.","tags":["artifact"]},{"id":"final-empire","category":"factions","name":"The Final Empire","book":1,"chapter":1,"meta":"State","desc":"The Lord Ruler's thousand-year dominion. Skaa below, nobles above, obligators everywhere.","tags":["state"]},{"id":"steel-ministry","category":"factions","name":"The Steel Ministry","book":1,"chapter":2,"meta":"Priesthood","desc":"The Lord Ruler's church and bureaucracy. Obligators witness every contract; Inquisitors hunt heresy.","tags":["ministry"]},{"id":"obligators","category":"factions","name":"Obligators","book":1,"chapter":1,"meta":"Priesthood","desc":"Ministry priests with tattoos around their eyes. Required to witness every legal transaction.","tags":["ministry"]},{"id":"kelsier-crew","category":"factions","name":"Kelsier's Crew","book":1,"chapter":4,"meta":"Thieves","desc":"A handpicked team of Misting thieves assembled to topple an empire — at impossible odds.","tags":["crew"]},{"id":"skaa-rebellion","category":"factions","name":"The Skaa Rebellion","book":1,"chapter":4,"meta":"Underground","desc":"Centuries-old resistance to the Final Empire. Once led by Marsh, then Yeden.","tags":["skaa"]},{"id":"great-houses","category":"factions","name":"The Great Houses","book":1,"chapter":7,"meta":"Nobility","desc":"Noble families at the apex of Luthadel society. They dance at balls and assassinate by night.","tags":["nobility"]},{"id":"house-venture","category":"factions","name":"House Venture","book":1,"chapter":7,"meta":"Great House","desc":"The most powerful of the Great Houses. Elend's family. Atium contract-holders.","tags":["nobility"]},{"id":"house-elariel","category":"factions","name":"House Elariel","book":1,"chapter":7,"meta":"Great House","desc":"Venture's chief rival. Shan's family.","tags":["nobility"]},{"id":"house-hasting","category":"factions","name":"House Hasting","book":1,"chapter":22,"meta":"Great House","desc":"An old powerful house. Middling but ambitious.","tags":["nobility"]},{"id":"assembly","category":"factions","name":"The Assembly","book":2,"chapter":1,"meta":"Government","desc":"Elend's experiment in representative government for post-Ruler Luthadel. As fragile as it sounds.","tags":["government"]},{"id":"kandra-nation","category":"factions","name":"The Kandra Generations","book":2,"chapter":36,"meta":"Hidden nation","desc":"All living kandra, organised into Generations by order of creation. Ruled by the First Generation.","tags":["kandra"]},{"id":"skaa","category":"creatures","name":"Skaa","book":1,"chapter":1,"meta":"The common people","desc":"The enslaved lower class of the Final Empire. Told for a thousand years they cannot be Allomancers. Often a lie.","tags":["human"]},{"id":"terrismen","category":"creatures","name":"Terrismen","book":1,"chapter":6,"meta":"Northern people","desc":"A tall, long-lived northern people. The men bred as stewards and eunuchs by the Empire's breeding program.","tags":["human"]},{"id":"kandra","category":"creatures","name":"Kandra","book":1,"chapter":18,"meta":"Shapeshifter","desc":"Shapeshifters who consume a body and reshape themselves to match it exactly. Bound by Contract.","tags":["shapeshifter"]},{"id":"koloss","category":"creatures","name":"Koloss","book":1,"chapter":20,"meta":"War beasts","desc":"Blue-skinned, ever-growing giants. Violent, stupid, utterly obedient — to someone.","tags":["monster"]},{"id":"mistwraiths","category":"creatures","name":"Mistwraiths","book":1,"chapter":18,"meta":"Mist creature","desc":"Animalistic bone-and-skin creatures that drift through the mists. Less than they once were.","tags":["monster"]},{"id":"the-mist","category":"creatures","name":"The Mist","book":1,"chapter":1,"meta":"Phenomenon","desc":"Thick silver fog that rolls across the land every night. Skaa huddle indoors; Mistborn ride through it.","tags":["phenomenon"]},{"id":"mist-spirit","category":"creatures","name":"The Mist Spirit","book":2,"chapter":9,"meta":"Unknown","desc":"A flickering presence Vin glimpses in the mists. It seems to be trying to warn her.","tags":["mystery"]},{"id":"deepness","category":"lore","name":"The Deepness","book":1,"chapter":7,"meta":"Ancient threat","desc":"A terror the Hero of Ages defeated a thousand years ago. Exactly what it was — no one agrees.","tags":["mythic"]},{"id":"hero-of-ages","category":"lore","name":"The Hero of Ages","book":1,"chapter":7,"meta":"Prophecy","desc":"A prophesied figure from Terris lore. Supposed to take up power at the Well of Ascension and save the world.","tags":["prophecy"]},{"id":"ashmounts","category":"lore","name":"The Ashmounts","book":1,"chapter":1,"meta":"Geography","desc":"Great volcanic mountains scattered across the Empire. They rain ash ceaselessly over the land.","tags":["world"]},{"id":"ash-falls","category":"lore","name":"Ashfall","book":1,"chapter":1,"meta":"Environment","desc":"Dark flakes from the Ashmounts. They coat every street, rooftop, and field — perpetually.","tags":["world"]},{"id":"red-sun","category":"lore","name":"The Red Sun","book":1,"chapter":1,"meta":"Sky","desc":"A sullen red sun that never fully clears the haze. The world has not seen green sky in a thousand years.","tags":["world"]},{"id":"ascension","category":"lore","name":"The Ascension","book":1,"chapter":7,"meta":"Historical event","desc":"The Lord Ruler's taking of power at the Well a thousand years ago. His origin, such as it is known.","tags":["history"]},{"id":"terris-prophecy","category":"lore","name":"Terris Prophecies","book":1,"chapter":6,"meta":"Religion","desc":"Ancient Terris scriptures foretelling the Hero. Long suppressed by the Ministry.","tags":["religion"]},{"id":"allomancy-rules","category":"lore","name":"The Rules of Allomancy","book":1,"chapter":11,"meta":"Magic law","desc":"Bronze reveals. Copper hides. The basic-eight metals come in complementary pairs. Everything has balance.","tags":["magic"]},{"id":"well-ascension-lore","category":"lore","name":"The Well of Ascension (legend)","book":1,"chapter":7,"meta":"Legend","desc":"The Terris prophecy's promised power. A second coming, a thousand years after the first.","tags":["prophecy"]},{"id":"religions-collected","category":"lore","name":"Sazed's Religions","book":1,"chapter":16,"meta":"Scholarship","desc":"Sazed has catalogued hundreds of dead religions in his copperminds. Each wiped out by the Ministry.","tags":["religion"]},{"id":"first-contract","category":"lore","name":"The First Contract","book":2,"chapter":36,"meta":"Kandra law","desc":"The foundational contract between kandra and their creator. Secret even to most kandra.","tags":["kandra"]},{"id":"savant","category":"lore","name":"Allomantic Savants","book":2,"chapter":42,"meta":"Phenomenon","desc":"Allomancers who burn one metal constantly until the ability warps and deepens. Mental cost: profound.","tags":["magic"]},{"id":"pulses-at-the-well","category":"lore","name":"The Pulsing","book":2,"chapter":1,"meta":"Phenomenon","desc":"A rhythmic pulse Vin feels growing stronger across the land. Something at the Well is waking.","tags":["mystery"]},{"id":"kandra-blessings","category":"lore","name":"The Kandra Blessings","book":3,"chapter":19,"meta":"Kandra lore","desc":"Each kandra carries two small spikes granting one of four gifts: Presence, Potency, Awareness, Stability.","tags":["kandra"]},{"id":"ruin-influence","category":"lore","name":"Ruin's Influence","book":3,"chapter":5,"meta":"Power","desc":"Ruin can subtly alter any written text touched by metal. Trust nothing set in type.","tags":["power"]}]}</script>
<script id="wok-codex" type="application/json">{"meta":{"title":"The Way of Kings","author":"Brandon Sanderson","series":"The Stormlight Archive","description":"Life before death. Strength before weakness. Journey before destination.","theme":"stormlight"},"books":[{"num":1,"title":"The Way of Kings","chapters":75}],"categories":{"characters":{"label":"Dramatis Personae","seal":"☥"},"places":{"label":"Cartography","seal":"✦"},"items":{"label":"Artefacts & Arms","seal":"❖"},"factions":{"label":"Nations & Orders","seal":"⚔"},"creatures":{"label":"Bestiary & Spren","seal":"☽"},"concepts":{"label":"Lore & Concepts","seal":"⚜"},"weather":{"label":"World & Weather","seal":"⚘"}},"entries":[{"id":"kalak","category":"characters","name":"Kalak","book":1,"chapter":1,"meta":"Herald","desc":"One of the ten Heralds. Weary after centuries of dying and returning. Carries one of the swords driven into the spire.","tags":["herald","prelude"]},{"id":"jezrien","category":"characters","name":"Jezrien","book":1,"chapter":1,"meta":"King of Heralds","desc":"Calm, regal Herald in white and blue, with a short black beard. Once wore a crown. The one who declares the Oathpact ended.","tags":["herald","prelude"]},{"id":"talenel","category":"characters","name":"Talenel (Taln)","book":1,"chapter":1,"meta":"Herald","desc":"The only Herald who died this Desolation, holding the northern waterway. He returns now to the place between Desolations — alone.","tags":["herald"]},{"id":"ishar","category":"characters","name":"Ishar","book":1,"chapter":1,"meta":"Herald","desc":"Mentioned only — the Herald who believes one of them remaining bound may be enough to end the cycle.","tags":["herald"]},{"id":"shalash","category":"characters","name":"Shalash","book":1,"chapter":1,"meta":"Herald","desc":"Female Herald of the ten. Her statue is conspicuously missing from a line of nine in the Alethi palace — for reasons unknown.","tags":["herald"]},{"id":"jezerezeh","category":"characters","name":"Jezerezeh, Ishi, Kelek, Talenelat","book":1,"chapter":1,"meta":"Heralds","desc":"Four of the ten Heralds whose statues line the palace hall — venerated in Vorin theology.","tags":["herald"]},{"id":"szeth","category":"characters","name":"Szeth-son-son-Vallano","book":1,"chapter":1,"meta":"Truthless of Shinovar","desc":"A small, pale-skinned Shin man with a shaved head. Bound to a terrible duty he loathes. Wears white when sent to kill.","tags":["assassin","shin"]},{"id":"gavilar","category":"characters","name":"King Gavilar Kholin","book":1,"chapter":1,"meta":"Alethi king","desc":"Powerful Alethi king with a black beard flecked with white and pale green eyes. Killed at the treaty feast he himself hosted.","tags":["nobility","deceased"]},{"id":"thaidakar","category":"characters","name":"Thaidakar","book":1,"chapter":1,"meta":"Unknown","desc":"A name King Gavilar speaks while dying — a person he assumed had sent the assassin. Szeth has never heard of him.","tags":["mystery"]},{"id":"restares","category":"characters","name":"Restares","book":1,"chapter":1,"meta":"Unknown","desc":"Another name King Gavilar speaks while dying. Szeth recognises neither.","tags":["mystery"]},{"id":"cenn","category":"characters","name":"Cenn","book":1,"chapter":1,"meta":"Young recruit","desc":"A fifteen-year-old spearman in his first battle. Terrified. Newly transferred into Squadleader Kaladin's squad.","tags":["soldier","pov"]},{"id":"dallet","category":"characters","name":"Dallet","book":1,"chapter":1,"meta":"Squad sergeant","desc":"A weathered, bearded veteran in Kaladin's squad. Calm, gruff, the kind of man soldiers trust.","tags":["soldier"]},{"id":"kaladin","category":"characters","name":"Kaladin","book":1,"chapter":1,"meta":"Squadleader","desc":"A young, scarred squadleader in Brightlord Amaram's army. His soldiers call him Stormblessed. By Ch 2 — a slave, branded shash.","tags":["protagonist"]},{"id":"amaram","category":"characters","name":"Brightlord Amaram","book":1,"chapter":1,"meta":"Alethi commander","desc":"An Alethi lighteyed commander whose banner Kaladin's squad fights under. Watches over northern Alethkar.","tags":["nobility"]},{"id":"hallaw","category":"characters","name":"Hallaw","book":1,"chapter":1,"meta":"Enemy lord","desc":"An enemy Alethi noble whose forces clash with Amaram's in a border skirmish. Kaladin targets one of his battalionlords.","tags":["nobility"]},{"id":"tvlakv","category":"characters","name":"Tvlakv","book":1,"chapter":2,"meta":"Slaver","desc":"A portly, limping Thaylen slavemaster with white eyebrows pushed up over his ears. Pragmatic, oily, careful with his investment.","tags":["slaver"]},{"id":"bluth","category":"characters","name":"Bluth","book":1,"chapter":2,"meta":"Slaver mercenary","desc":"One of Tvlakv's hired guards. Slab-faced, carries a cudgel.","tags":["mercenary"]},{"id":"tien","category":"characters","name":"Tien","book":1,"chapter":2,"meta":"Kaladin's brother","desc":"Mentioned only — a youthful face whose name Kaladin remembers with grief. \"Looking to Kaladin for salvation.\"","tags":["family","deceased"]},{"id":"tukks","category":"characters","name":"Tukks & the Takers","book":1,"chapter":2,"meta":"Kaladin's old squad","desc":"Mentioned only — a squad Kaladin once knew, before Cenn and Dallet. All dead.","tags":["soldier","deceased"]},{"id":"shallan","category":"characters","name":"Shallan Davar","book":1,"chapter":3,"meta":"Young noblewoman","desc":"A pale, freckled redheaded Veden girl with light blue eyes. Quiet, witty when permitted, secretly travelling to Kharbranth with a desperate plan.","tags":["protagonist"]},{"id":"yalb","category":"characters","name":"Yalb","book":1,"chapter":3,"meta":"Thaylen sailor","desc":"A cheerful young sailor, thick of accent, who guides Shallan up to the Conclave.","tags":["sailor"]},{"id":"tozbek","category":"characters","name":"Captain Tozbek","book":1,"chapter":3,"meta":"Thaylen captain","desc":"Captain of the Wind's Pleasure. Short, calm, with long Thaylen eyebrows worn in a spiked pattern. A trusted business contact of House Davar.","tags":["sailor"]},{"id":"ashlv","category":"characters","name":"Ashlv","book":1,"chapter":3,"meta":"Tozbek's wife","desc":"Captain Tozbek's wife. Handles dock registration.","tags":["minor"]},{"id":"tag","category":"characters","name":"Tag","book":1,"chapter":4,"meta":"Slaver mercenary","desc":"Tvlakv's other hired guard. Less brutal than Bluth — refuses an order at one point.","tags":["mercenary"]},{"id":"jasnah","category":"characters","name":"Jasnah Kholin","book":1,"chapter":5,"meta":"Princess, scholar","desc":"Tall, statuesque Alethi princess in her mid-thirties — a scholar of world-shaking reputation, and the only royal openly to profess heresy.","tags":["nobility","scholar"]},{"id":"taravangian","category":"characters","name":"King Taravangian","book":1,"chapter":5,"meta":"King of Kharbranth","desc":"An elderly monarch with a wispy white beard and pale grey eyes. Kindly, patient, accommodating. Wears the orange and white of his city.","tags":["nobility"]},{"id":"gaz","category":"characters","name":"Gaz","book":1,"chapter":6,"meta":"Bridge sergeant","desc":"A one-eyed, weaselly sergeant who supervises the bridge crews. Chews tobacco and resents anyone who acts above their station.","tags":["antagonist"]},{"id":"syl","category":"characters","name":"Sylphrena (Syl)","book":1,"chapter":6,"meta":"Windspren","desc":"A small, blue-white spren who appears as a young woman with flowing skirt. Curious, playful — and oddly able to remember Kaladin's name.","tags":["spren"]},{"id":"lamaril","category":"characters","name":"Lamaril","book":1,"chapter":6,"meta":"Lieutenant","desc":"A lieutenant who oversees the bridge crews under Sadeas. Mentioned by name when bridgemen are assigned.","tags":["soldier"]},{"id":"kabsal","category":"characters","name":"Brother Kabsal","book":1,"chapter":7,"meta":"Ardent","desc":"A friendly young ardent at the Palanaeum, with spectacles and a fondness for sketching. Takes an immediate interest in Shallan.","tags":["ardent"]},{"id":"luesh","category":"characters","name":"Luesh","book":1,"chapter":7,"meta":"Davar steward","desc":"Steward of House Davar. A close confidant of Shallan's father and trained to use the family's Soulcaster — though it no longer works for him.","tags":["servant"]},{"id":"balat-mention","category":"characters","name":"Nan Balat (mentioned)","book":1,"chapter":7,"meta":"Shallan's brother","desc":"Shallan recalls him bruised, his coat torn — a fragment of memory she keeps trying to bury.","tags":["family"]},{"id":"helaran","category":"characters","name":"Helaran (mentioned)","book":1,"chapter":8,"meta":"Shallan's eldest brother","desc":"Mentioned in Shallan's thoughts — Nan Helaran, eldest of her brothers. Once stood up to their father. Now dead.","tags":["family","deceased"]},{"id":"lirin","category":"characters","name":"Lirin","book":1,"chapter":10,"meta":"Surgeon","desc":"Kaladin's father — a careful, exacting town surgeon in Hearthstone. Trains young Kal in medicine from boyhood.","tags":["family"]},{"id":"hesina","category":"characters","name":"Hesina","book":1,"chapter":10,"meta":"Kaladin's mother","desc":"Lirin's wife. Assists him in the surgery.","tags":["family"]},{"id":"wistiow","category":"characters","name":"Brightlord Wistiow","book":1,"chapter":10,"meta":"Old citylord","desc":"The aging lighteyed lord of Hearthstone. Pays for the spheres that light Lirin's surgery.","tags":["nobility"]},{"id":"sani","category":"characters","name":"Sani","book":1,"chapter":10,"meta":"Patient","desc":"A fifteen-year-old girl with a wounded freehand, brought to Lirin's surgery. Drugged for the procedure.","tags":["minor"]},{"id":"tien-seen","category":"characters","name":"Tien (in flashback)","book":1,"chapter":10,"meta":"Kaladin's brother","desc":"Kaladin's younger brother, seen in a nine-year-ago flashback. The reason Kaladin trains so urgently to protect.","tags":["family"]},{"id":"teft","category":"characters","name":"Teft","book":1,"chapter":11,"meta":"Older bridgeman","desc":"A grizzled, closed-off older man in Bridge Four. Watches Kaladin with more interest than he admits to.","tags":["bridge-four"]},{"id":"ishikk","category":"characters","name":"Ishikk","book":1,"chapter":11,"meta":"Purelake fisher","desc":"A simple-minded Purelaker fisherman who walks barefoot in the shallow waters. Hired by foreigners to ask questions.","tags":["interlude"]},{"id":"hoid-mention","category":"characters","name":"Hoid (mentioned)","book":1,"chapter":11,"meta":"Sought by foreigners","desc":"A man whom three foreigners are searching for. White-haired, clever-tongued, with an arrowlike face. Also called Roamer. Disguises himself.","tags":["mystery"]},{"id":"three-foreigners","category":"characters","name":"The Three Foreigners","book":1,"chapter":11,"meta":"Searchers","desc":"Two Makabaki men and a third with odd features, hunting for Hoid in the Purelake. They use false names. Ishikk calls them Grump, Blunt, and Thinker.","tags":["interlude","mystery"]},{"id":"balat","category":"characters","name":"Nan Balat","book":1,"chapter":11,"meta":"Shallan's brother","desc":"A crippled twenty-three-year-old who walks with a cane. Sits on the porch of the Davar manor, killing small crabs for relief from pain.","tags":["family","interlude"]},{"id":"wikim","category":"characters","name":"Tet Wikim","book":1,"chapter":11,"meta":"Shallan's brother","desc":"Shallan's brother. Recently emerged from a bout of melancholy. Comes running with bad news.","tags":["family","interlude"]},{"id":"asha-jushu","category":"characters","name":"Asha Jushu","book":1,"chapter":11,"meta":"Shallan's brother","desc":"Shallan's brother — driven to vice by their father's brutal temper. Mentioned only in Balat's thoughts.","tags":["family","interlude"]},{"id":"eylita","category":"characters","name":"Eylita","book":1,"chapter":11,"meta":"Balat's beloved","desc":"A woman dear to Nan Balat, mentioned but not yet seen.","tags":["minor","interlude"]},{"id":"took","category":"characters","name":"Took","book":1,"chapter":11,"meta":"Szeth's master","desc":"A grimy, mean-spirited Bav mine-worker who currently holds Szeth's oathstone. Uses him for tavern entertainment.","tags":["interlude"]},{"id":"alethkar","category":"places","name":"Alethkar","book":1,"chapter":1,"meta":"Kingdom","desc":"The eastern kingdom of the proud, dark-haired Alethi. Ten highprincedoms, united uneasily under King Elhokar.","tags":["nation"]},{"id":"shinovar","category":"places","name":"Shinovar","book":1,"chapter":1,"meta":"Western land","desc":"A quiet land beyond the mountains where grass grows tall and people worship stones. Home of the Shin.","tags":["nation"]},{"id":"thaylenah","category":"places","name":"Thaylenah","book":1,"chapter":1,"meta":"Island nation","desc":"Seafaring island kingdom. Home of the Thaylens, with their distinctive long white eyebrows.","tags":["nation"]},{"id":"jah-keved","category":"places","name":"Jah Keved","book":1,"chapter":1,"meta":"Kingdom","desc":"A large kingdom to the south and west of Alethkar. Shallan's homeland.","tags":["nation"]},{"id":"kholinar","category":"places","name":"Kholinar","book":1,"chapter":1,"meta":"Alethi capital","desc":"The walled capital of Alethkar. Site of the treaty feast where King Gavilar was assassinated.","tags":["city"]},{"id":"shattered-plains","category":"places","name":"The Shattered Plains","book":1,"chapter":1,"meta":"War front","desc":"A vast eastern plateau-land where the Alethi wage their war of vengeance against the Parshendi.","tags":["warfront"]},{"id":"unclaimed-hills","category":"places","name":"The Unclaimed Hills","book":1,"chapter":2,"meta":"Region","desc":"A wild grassland ruled by no kingdom, dotted with strange shrubs. Tvlakv's slaver caravan crosses it for months.","tags":["region"]},{"id":"sas-morom","category":"places","name":"Sas Morom","book":1,"chapter":2,"meta":"Highlord's district","desc":"An Alethi district whose glyphpair appears as a slave brand on a scraggly-bearded slave Kaladin meets.","tags":["region"]},{"id":"kharbranth","category":"places","name":"Kharbranth","book":1,"chapter":3,"meta":"City of Bells","desc":"A small, peaceable city-state built up the side of a steep cliff. Famed for its bells — and for its underground library.","tags":["city"]},{"id":"palanaeum","category":"places","name":"The Palanaeum","book":1,"chapter":3,"meta":"Kharbranth","desc":"A vast underground library carved into the cliffs of Kharbranth. Holds books beyond counting.","tags":["library"]},{"id":"conclave","category":"places","name":"The Conclave","book":1,"chapter":3,"meta":"Kharbranth","desc":"A grand stone building at the top of Kharbranth. Carved from the rock itself. Seat of the king and home of the Palanaeum.","tags":["city"]},{"id":"vedenar","category":"places","name":"Vedenar","book":1,"chapter":3,"meta":"Veden city","desc":"The Veden capital. Tozbek would return Shallan there if her plan failed.","tags":["city"]},{"id":"tashikk","category":"places","name":"Tashikk","book":1,"chapter":3,"meta":"Distant region","desc":"A far western land whose people wear distinctive single-sheet wraps.","tags":["region"]},{"id":"natanatan","category":"places","name":"Natanatan","book":1,"chapter":3,"meta":"Foreign land","desc":"A land whose men have gloved hands and faintly bluish skin. Glimpsed by Shallan in the Kharbranth crowds.","tags":["region"]},{"id":"dumadari","category":"places","name":"Dumadari","book":1,"chapter":3,"meta":"City","desc":"A city where Jasnah originally summoned Shallan to meet her. Shallan arrived too late.","tags":["city"]},{"id":"warcamps","category":"places","name":"The Warcamps","book":1,"chapter":6,"meta":"Shattered Plains","desc":"Ten fortified camps at the edge of the Shattered Plains, one for each Alethi highprince. Kaladin is brought to Sadeas's camp.","tags":["warfront"]},{"id":"honor-chasm","category":"places","name":"The Honor Chasm","book":1,"chapter":6,"meta":"Shattered Plains","desc":"A deep chasm at the edge of the warcamp where bridgemen who have given up cast themselves down. Named for what they leave behind.","tags":["warfront"]},{"id":"hearthstone","category":"places","name":"Hearthstone","book":1,"chapter":6,"meta":"Kaladin's hometown","desc":"A small Alethi town in Highprince Sadeas's lands, where Kaladin grew up the son of a surgeon.","tags":["town"]},{"id":"horneater-peaks","category":"places","name":"The Horneater Peaks","book":1,"chapter":11,"meta":"Mountains","desc":"A range of mountains marking the higher elevations of western Jah Keved.","tags":["region","interlude"]},{"id":"purelake","category":"places","name":"The Purelake","book":1,"chapter":11,"meta":"Shallow lake","desc":"A vast, shallow, glass-clear lake where the warm water never rises above the knee. Once part of the kingdom of Sela Tales.","tags":["region","interlude"]},{"id":"fu-abra","category":"places","name":"Fu Abra","book":1,"chapter":11,"meta":"Purelake village","desc":"A village of stilted, domed buildings standing in the shallow Purelake. One of several similarly-named settlements.","tags":["village","interlude"]},{"id":"stormlight","category":"concepts","name":"Stormlight","book":1,"chapter":1,"meta":"Power","desc":"A luminous, holy energy infused into gemstones during a highstorm. Powers spheres, fabrials, and — Szeth has shown — far more.","tags":["magic"]},{"id":"oathpact","category":"concepts","name":"The Oathpact","book":1,"chapter":1,"meta":"Ancient binding","desc":"An ancient binding among the ten Heralds that holds back the Desolations — at terrible personal cost. Now declared ended.","tags":["mythic"]},{"id":"desolations","category":"concepts","name":"The Desolations","book":1,"chapter":1,"meta":"Cataclysms","desc":"Recurring world-shattering wars in which an unnamed enemy descends and humanity is nearly destroyed. The Heralds defend, and die again, and return.","tags":["mythic"]},{"id":"everstorm","category":"concepts","name":"The Everstorm","book":1,"chapter":1,"meta":"Death-rattle warning","desc":"Mentioned in a death-rattle epigraph: \"It is but a thousand days, and the Everstorm comes.\" Meaning unknown.","tags":["death-rattle"]},{"id":"lashings","category":"concepts","name":"The Three Lashings","book":1,"chapter":1,"meta":"Szeth's art","desc":"Szeth's three abilities, fueled by Stormlight: a Basic Lashing alters which way is down for him; a Full Lashing binds objects together; a Reverse Lashing pulls things toward an anchor.","tags":["magic"]},{"id":"truthless","category":"concepts","name":"Truthless","book":1,"chapter":1,"meta":"Shin judgment","desc":"A Shin man condemned by his Stone Shamans. Stripped of name and home, bound to obey whoever holds his oathstone — utterly. Forbidden to take his own life.","tags":["culture"]},{"id":"vorinism","category":"concepts","name":"Vorin theology","book":1,"chapter":1,"meta":"Religion","desc":"The dominant eastern faith. Reveres the Almighty and the ten Heralds. Forbids treading on worked stone — at least, by Shin reckoning.","tags":["religion"]},{"id":"almighty","category":"concepts","name":"The Almighty","book":1,"chapter":1,"meta":"God","desc":"The single god of Vorinism. Sworn upon, prayed to, blamed.","tags":["religion"]},{"id":"stormfather","category":"concepts","name":"Stormfather","book":1,"chapter":1,"meta":"Oath / spirit","desc":"Invoked in oaths and curses. Associated with the highstorms. Beyond that — only stories.","tags":["religion"]},{"id":"lighteyes-darkeyes","category":"concepts","name":"Lighteyes & Darkeyes","book":1,"chapter":1,"meta":"Social order","desc":"Alethi society is split by eye colour. Light eyes are noble — chosen at birth by the Heralds. Dark eyes are commoners. Winning a Shardblade can change that.","tags":["culture"]},{"id":"stormblessed","category":"concepts","name":"Stormblessed","book":1,"chapter":1,"meta":"Soldier's epithet","desc":"An honorific Kaladin's soldiers attach to him. Said to bring luck — though Kaladin himself disbelieves it.","tags":["epithet"]},{"id":"old-magic","category":"concepts","name":"The Old Magic","book":1,"chapter":2,"meta":"Western legend","desc":"A Selay legend of a power that grants curses. Kaladin once heard a slave from the West speak of it.","tags":["legend"]},{"id":"calling","category":"concepts","name":"Calling & Glory","book":1,"chapter":3,"meta":"Vorin doctrine","desc":"In Vorin belief, every person chooses a Calling — the work to which they dedicate their life. Excellence in it earns Glory in the afterlife.","tags":["religion"]},{"id":"devotaries","category":"concepts","name":"Devotaries","book":1,"chapter":3,"meta":"Vorin congregations","desc":"The various religious congregations that proper Vorin people join, often paired to one's chosen Calling.","tags":["religion"]},{"id":"feminine-script","category":"concepts","name":"Glyphs & the Feminine Script","book":1,"chapter":3,"meta":"Writing","desc":"Reading and writing letters is a feminine art. Men are taught only glyphs. A man who reads is suspect — unless he is an ardent.","tags":["culture"]},{"id":"safehand","category":"concepts","name":"Safehand & Sleeve","book":1,"chapter":3,"meta":"Vorin custom","desc":"A Vorin woman's left hand is kept hidden — by glove for commoners, by buttoned sleeve for the highborn. The freehand is the right.","tags":["culture"]},{"id":"nahn-dahn","category":"concepts","name":"Nahn & Dahn (ranks)","book":1,"chapter":3,"meta":"Social rank","desc":"Numerical ranks within Vorin society: nahn for darkeyed citizens, dahn for lighteyed nobles. Lower numbers are higher rank.","tags":["culture"]},{"id":"hierocracy","category":"concepts","name":"The Hierocracy","book":1,"chapter":3,"meta":"Old terror","desc":"An era of religious tyranny that ended long ago. Mentioned only in passing as a thing Kharbranth predates.","tags":["history"]},{"id":"recreance","category":"concepts","name":"The Recreance","book":1,"chapter":3,"meta":"Historical betrayal","desc":"An older betrayal — in which the Knights Radiant cast down their Shards and walked away from their oaths. Reason: unknown.","tags":["history"]},{"id":"last-desolation","category":"concepts","name":"The Last Desolation","book":1,"chapter":3,"meta":"Mythic past","desc":"The most recent Desolation, thousands of years ago. Kharbranth predates it.","tags":["history"]},{"id":"vengeance-pact","category":"concepts","name":"The Vengeance Pact","book":1,"chapter":4,"meta":"Alethi oath","desc":"The oath sworn by all ten highprinces to avenge King Gavilar's murder. The reason the Alethi armies sit upon the Shattered Plains.","tags":["oath"]},{"id":"stormwarden","category":"concepts","name":"Stormwardens","book":1,"chapter":4,"meta":"Predictors","desc":"Scholars who attempt to predict highstorms.","tags":["scholar"]},{"id":"soulcasting","category":"concepts","name":"Soulcasting","book":1,"chapter":5,"meta":"Art","desc":"The art of transforming one substance into another using a Soulcaster fabrial. Practiced — publicly — only by ardents.","tags":["magic"]},{"id":"proving-day","category":"concepts","name":"Proving Day","book":1,"chapter":5,"meta":"Holy day","desc":"A Vorin holy day. Used by Brother Kabsal as casual reference.","tags":["religion"]},{"id":"nightwatcher","category":"concepts","name":"The Nightwatcher","book":1,"chapter":11,"meta":"Western legend","desc":"A figure of legend connected to the Old Magic. Said to grant boons — and curses to match them.","tags":["legend","interlude"]},{"id":"shardblade","category":"items","name":"Shardblade","book":1,"chapter":1,"meta":"Legendary weapon","desc":"A summoned, impossibly sharp blade. Cuts stone and steel like air, but kills men by burning out their eyes — severing the soul, not the flesh.","tags":["shardwielder"]},{"id":"shardplate","category":"items","name":"Shardplate","book":1,"chapter":1,"meta":"Legendary armour","desc":"Gleaming, seamless plate that lends superhuman strength. Powered by gemstones; cracked plate leaks Stormlight.","tags":["shardwielder"]},{"id":"spheres","category":"items","name":"Spheres","book":1,"chapter":1,"meta":"Currency / light","desc":"Glass beads with gemstones at their hearts. Infused with Stormlight they glow, serving as both money and lantern.","tags":["money"]},{"id":"denominations","category":"items","name":"Chips, Marks & Broams","book":1,"chapter":3,"meta":"Sphere denominations","desc":"The three sizes of sphere: chip (smallest, faint glow), mark (candle-like), broam (bright as several candles). Each comes in diamond, sapphire, ruby, emerald.","tags":["money"]},{"id":"soulcaster-item","category":"items","name":"Soulcaster (the fabrial)","book":1,"chapter":5,"meta":"Royal artifact","desc":"A device of two rings, a bracelet, and chains holding three large gemstones across the back of the hand. Transforms substances by ardent art.","tags":["fabrial"]},{"id":"fabrials","category":"items","name":"Fabrials","book":1,"chapter":5,"meta":"Devices","desc":"Devices using gemstones to produce effects of heat, light, force, or transmutation. A budding science.","tags":["fabrial"]},{"id":"wind-pleasure","category":"items","name":"The Wind's Pleasure","book":1,"chapter":3,"meta":"Vessel","desc":"Captain Tozbek's narrow, single-masted ship. Bore Shallan to Kharbranth.","tags":["ship"]},{"id":"slave-brand-shash","category":"items","name":"The Shash Brand","book":1,"chapter":1,"meta":"Slave mark","desc":"Brands on a slave's forehead. The shash glyph marks one declared especially dangerous — Kaladin wears one.","tags":["slavery"]},{"id":"oathstone","category":"items","name":"Oathstones","book":1,"chapter":1,"meta":"Shin custom","desc":"A stone holding an oath. Whoever holds a Shin's oathstone is their master — a binding far beyond slavery.","tags":["culture"]},{"id":"black-sphere","category":"items","name":"The Strange Sphere","book":1,"chapter":1,"meta":"Mystery","desc":"A small crystalline sphere on a chain, given by King Gavilar to Szeth in his dying moments. Glows somehow — with a light that is black.","tags":["mystery"]},{"id":"spanreed","category":"items","name":"Spanreeds","book":1,"chapter":11,"meta":"Communication device","desc":"Linked writing implements that allow letters to be sent across vast distances — what one writes on one, the other replicates.","tags":["fabrial","interlude"]},{"id":"alethi","category":"factions","name":"The Alethi","book":1,"chapter":1,"meta":"Warrior people","desc":"Tall, dark-haired warriors of the eastern lands. Proud martial traditions, embroidered silk coats, and constant talk of honour.","tags":["nation"]},{"id":"parshendi","category":"factions","name":"The Parshendi","book":1,"chapter":1,"meta":"Enemy","desc":"A marble-skinned, carapace-armoured people. Cousins to the docile parshmen. Killers of King Gavilar — by their own treaty-night assassin.","tags":["antagonist"]},{"id":"parshmen","category":"factions","name":"Parshmen","book":1,"chapter":1,"meta":"Servants","desc":"Docile, marble-skinned labourers found across Roshar. Stout, mute, used for any work. Owned, not paid.","tags":["servants"]},{"id":"knights-radiant","category":"factions","name":"The Knights Radiant","book":1,"chapter":1,"meta":"Lost order","desc":"Ten ancient orders who once wielded Shardblades against the Voidbringers. They abandoned their oaths in the Recreance.","tags":["mythic"]},{"id":"heralds","category":"factions","name":"The Ten Heralds","book":1,"chapter":1,"meta":"Mythic figures","desc":"Ten ancient divine champions who led mankind against the Desolations. Saints of Vorinism. Mortal — each one returning, again and again, from a place of nightmares.","tags":["mythic"]},{"id":"stone-shamans","category":"factions","name":"Stone Shamans","book":1,"chapter":1,"meta":"Shin priests","desc":"Priests of the Shin who tend the sacred stones — and pronounce judgments such as Truthless.","tags":["religion"]},{"id":"ardents","category":"factions","name":"Ardents","book":1,"chapter":3,"meta":"Priesthood","desc":"Shaved-headed Vorin priests in robes. Technically slaves of their monarchs. Tend the arts, crafts, sciences — and Soulcasters.","tags":["religion"]},{"id":"house-davar","category":"factions","name":"House Davar","book":1,"chapter":3,"meta":"Veden minor house","desc":"A minor Veden house from the western highlands, raised by Brightlord Davar's ruthlessness and a few profitable marble deposits. Now in deep trouble.","tags":["nobility"]},{"id":"highprince-sadeas","category":"factions","name":"Sadeas's Princedom","book":1,"chapter":1,"meta":"Alethkar","desc":"The northern Alethi princedom under Highprince Sadeas. Includes Kaladin's home district. Banner: a yellow tower-and-hammer on green.","tags":["nobility"]},{"id":"windspren","category":"creatures","name":"Windspren","book":1,"chapter":1,"meta":"Spren","desc":"Playful spren of the wind. Translucent ribbons that may take small humanlike shapes. Mischievous, sometimes intelligent.","tags":["spren"]},{"id":"musicspren","category":"creatures","name":"Musicspren","book":1,"chapter":1,"meta":"Spren","desc":"Tiny spinning, translucent ribbons that gather around music.","tags":["spren"]},{"id":"fearspren","category":"creatures","name":"Fearspren","book":1,"chapter":1,"meta":"Spren","desc":"Globs of purple goo that wriggle from the floor where the frightened stand.","tags":["spren"]},{"id":"flamespren","category":"creatures","name":"Flamespren","book":1,"chapter":1,"meta":"Spren","desc":"Tiny figures of congealed light that dance around flames.","tags":["spren"]},{"id":"painspren","category":"creatures","name":"Painspren","book":1,"chapter":1,"meta":"Spren","desc":"Small orange spren shaped like long-fingered hands, crawling toward the wounded.","tags":["spren"]},{"id":"rotspren","category":"creatures","name":"Rotspren","book":1,"chapter":2,"meta":"Spren","desc":"Tiny red spren that gather around wounds going bad.","tags":["spren"]},{"id":"hungerspren","category":"creatures","name":"Hungerspren","book":1,"chapter":2,"meta":"Spren","desc":"Brown fly-like spren that flit around the head of the starving, almost too small to see.","tags":["spren"]},{"id":"logicspren","category":"creatures","name":"Logicspren","book":1,"chapter":7,"meta":"Spren","desc":"Spren drawn to careful thought — small blue stormcloud shapes hovering near the studious.","tags":["spren"]},{"id":"creationspren","category":"creatures","name":"Creationspren","book":1,"chapter":7,"meta":"Spren","desc":"Spren drawn to the act of creation — the making of art, of writing, of devising.","tags":["spren"]},{"id":"chull","category":"creatures","name":"Chulls","book":1,"chapter":1,"meta":"Beasts of burden","desc":"Wagon-sized red-shelled crustaceans with trunklike legs. Docile, slow, used to draw caravans.","tags":["beast"]},{"id":"rockbud","category":"creatures","name":"Rockbuds","book":1,"chapter":1,"meta":"Plant","desc":"Stone-shelled plants that retreat into their shells at the approach of wind or footfall. Common across Roshar.","tags":["plant"]},{"id":"skyeel","category":"creatures","name":"Skyeels","book":1,"chapter":1,"meta":"Flier","desc":"Eel-shaped creatures that undulate through the air, hunting rats and fish.","tags":["fauna"]},{"id":"cremling","category":"creatures","name":"Cremlings","book":1,"chapter":5,"meta":"Vermin","desc":"Small crustacean creatures that scuttle through cracks and under rocks everywhere on Roshar.","tags":["vermin"]},{"id":"axehound","category":"creatures","name":"Axehounds","book":1,"chapter":11,"meta":"Beast","desc":"Six-legged crustacean hounds covered in interlocking smooth-pliable plates. Can be loyal pets or working animals.","tags":["beast"]},{"id":"songling","category":"creatures","name":"Songlings","book":1,"chapter":11,"meta":"Curious creature","desc":"Disc-shaped creatures with four scraping arms that produce wild music. Cling to rocks and walls.","tags":["fauna"]},{"id":"thunderclast","category":"creatures","name":"Thunderclasts","book":1,"chapter":1,"meta":"Stone monster","desc":"Vast, vaguely skeletal beasts of stone with arrowhead faces and burning red eyes. Tear themselves free of the rock to fight.","tags":["mythic"]},{"id":"voidbringer","category":"creatures","name":"Voidbringers","book":1,"chapter":1,"meta":"Mythic enemy","desc":"Foes of legend with skin like stone — for whom the Knights Radiant were given their Shardblades. They may not exist any longer. They may never have.","tags":["mythic"]},{"id":"dustbringer","category":"creatures","name":"Dustbringers","book":1,"chapter":1,"meta":"Old order","desc":"Mentioned only — those whose burning work is left across the Prelude's battlefield. Whatever else they were, they could turn rock to smoke.","tags":["mythic"]},{"id":"surgebinder","category":"creatures","name":"Surgebinders","book":1,"chapter":1,"meta":"Old wielders","desc":"Mentioned only — wielders whose battles left the Prelude's stone scarred and shattered. Connection to other powers: unclear.","tags":["mythic"]},{"id":"highstorm","category":"weather","name":"Highstorms","book":1,"chapter":1,"meta":"Great storm","desc":"Apocalyptic stormfronts that roar across Roshar from east to west, charging gemstones with Stormlight. All Rosharan life is shaped around them.","tags":["weather"]},{"id":"stormwall","category":"weather","name":"The Stormwall","book":1,"chapter":4,"meta":"Highstorm face","desc":"The terrifying leading edge of a highstorm: a wall of wind, water, and airborne debris.","tags":["weather"]},{"id":"crem","category":"weather","name":"Crem","book":1,"chapter":3,"meta":"Sediment","desc":"Mud-like sediment left by every highstorm. Hardens into rock — a slow, perpetual burying of the world.","tags":["world"]},{"id":"lait","category":"weather","name":"Laits","book":1,"chapter":3,"meta":"Shelter","desc":"Areas of land naturally sheltered from the highstorms by rock formations. Many cities are built in laits.","tags":["world"]},{"id":"salas","category":"weather","name":"Salas (moon)","book":1,"chapter":2,"meta":"Sky","desc":"The smallest, dimmest of the moons — violet-coloured. Inspires countless poets, but lights nothing well.","tags":["sky"]},{"id":"nomon","category":"weather","name":"Nomon (moon)","book":1,"chapter":8,"meta":"Sky","desc":"Another of the moons of Roshar.","tags":["sky"]},{"id":"talns-scar","category":"weather","name":"Taln's Scar","book":1,"chapter":2,"meta":"Stars","desc":"A swath of deep red stars vivid against the sky. Seasonally visible, named in remembrance of the Herald Talenel.","tags":["sky"]},{"id":"adolin","category":"characters","name":"Adolin Kholin","book":1,"chapter":12,"meta":"Prince, Shardbearer","desc":"Dalinar's elder son. A 23-year-old duelist with blond-and-black hair. Inherited his Shardplate — painted blue, ornamented for show — from his mother's side at sixteen.","tags":["nobility","shardbearer"]},{"id":"renarin","category":"characters","name":"Renarin Kholin","book":1,"chapter":12,"meta":"Prince","desc":"Dalinar's younger son. Quiet, careful, often pausing before he speaks. Some find his measuring gaze unsettling.","tags":["nobility"]},{"id":"dalinar","category":"characters","name":"Dalinar Kholin","book":1,"chapter":12,"meta":"Highprince","desc":"The Blackthorn. Brother of the murdered king, uncle to the current one. A square-faced warrior with hair gone white at the temples. Wears slate-grey Plate, unornamented. Troubled by visions during highstorms.","tags":["nobility","shardbearer","protagonist"]},{"id":"elhokar","category":"characters","name":"King Elhokar Kholin","book":1,"chapter":12,"meta":"King of Alethkar","desc":"Gavilar's son, now king. Wears resplendent gold Shardplate. Anxious, eager for the hunt — unaware of how nearly he came to dying on it.","tags":["nobility","shardbearer"]},{"id":"sadeas","category":"characters","name":"Highprince Sadeas","book":1,"chapter":12,"meta":"Alethi highprince","desc":"A red-faced, bulbous-featured highprince in red Shardplate. Politically shrewd, sharp-tongued, a childhood friend of Dalinar's.","tags":["nobility","shardbearer"]},{"id":"vamah","category":"characters","name":"Highprince Vamah","book":1,"chapter":12,"meta":"Alethi highprince","desc":"One of the ten Alethi highprinces. Joined the king's hunt though he is not a Shardbearer.","tags":["nobility"]},{"id":"wit","category":"characters","name":"Wit","book":1,"chapter":12,"meta":"King's Wit","desc":"King Elhokar's Wit — a cleverly-tongued black-clad man with a silver sword at his side. Insults nobility for a living, with startling accuracy. Strange in ways Dalinar can't place.","tags":["mysterious"]},{"id":"navani-mention","category":"characters","name":"Navani Kholin (mentioned)","book":1,"chapter":12,"meta":"Queen Mother","desc":"Adolin's aunt. Gavilar's widow. Recently left the Shattered Plains; named in passing.","tags":["nobility"]},{"id":"gallant","category":"characters","name":"Gallant","book":1,"chapter":12,"meta":"Ryshadium","desc":"Dalinar's massive black Ryshadium stallion. One of the largest horses Adolin has ever seen.","tags":["beast"]},{"id":"moash","category":"characters","name":"Moash","book":1,"chapter":14,"meta":"Bridgeman","desc":"A lean, hawk-faced young Alethi in Bridge Four. Strong, angry, near Kaladin's age. Carries grievances he doesn't share.","tags":["bridge-four"]},{"id":"dunny","category":"characters","name":"Dunny","book":1,"chapter":14,"meta":"Bridgeman","desc":"A skinny young bridgeman in Bridge Four.","tags":["bridge-four"]},{"id":"narm","category":"characters","name":"Narm","book":1,"chapter":14,"meta":"Bridgeman","desc":"Another of the skinnier bridgemen of Bridge Four.","tags":["bridge-four"]},{"id":"sigzil","category":"characters","name":"Sigzil","book":1,"chapter":14,"meta":"Bridgeman","desc":"A dark-skinned Azish bridgeman in Bridge Four. Quiet and literate.","tags":["bridge-four"]},{"id":"leyten","category":"characters","name":"Leyten","book":1,"chapter":14,"meta":"Bridgeman","desc":"A bridgeman in Bridge Four — handy with leather and armour.","tags":["bridge-four"]},{"id":"roion","category":"characters","name":"Highprince Roion","book":1,"chapter":15,"meta":"Alethi highprince","desc":"One of the ten highprinces. Bitter over a recent insult by Wit at a feast.","tags":["nobility"]},{"id":"bethab","category":"characters","name":"Highprince Bethab","book":1,"chapter":15,"meta":"Alethi highprince","desc":"A highprince who has been pressing the king for chull contracts — slipping in clauses that would favour his claim in a succession.","tags":["nobility"]},{"id":"talata","category":"characters","name":"Talata","book":1,"chapter":15,"meta":"Scribe","desc":"A scribe in Dalinar's service, asked to review Bethab's contracts.","tags":["servant"]},{"id":"plateau","category":"places","name":"The Plateaus","book":1,"chapter":12,"meta":"Shattered Plains","desc":"Tens of thousands of stone islands across the Shattered Plains, separated by deep chasms. Crossed by bridges; site of every battle.","tags":["warfront"]},{"id":"cobalt-guard","category":"factions","name":"The Cobalt Guard","book":1,"chapter":12,"meta":"Kholin honor guard","desc":"Dalinar's elite blue-uniformed honor guard. Mentioned during the king's hunt.","tags":["soldier"]},{"id":"the-codes","category":"concepts","name":"The Codes (of war)","book":1,"chapter":12,"meta":"Old discipline","desc":"An ancient set of Alethi military disciplines. \"A general may not ask a man to do anything he would not do himself.\" Dalinar follows them. Few others do.","tags":["honor"]},{"id":"gemheart","category":"items","name":"Gemhearts","book":1,"chapter":12,"meta":"Greatshell prize","desc":"Massive uncut gemstones found within chasmfiend chrysalises. The reason the Alethi are stuck on the Shattered Plains, racing the Parshendi for them.","tags":["money"]},{"id":"chasmfiend","category":"creatures","name":"Chasmfiends","book":1,"chapter":12,"meta":"Greatshell","desc":"Vast, mountain-sized greatshells with arrowhead faces, four foreclaws, and dozens of clutching legs. Climb out of the chasms to pupate. Their gemhearts are priceless.","tags":["beast"]},{"id":"ryshadium","category":"creatures","name":"Ryshadium","book":1,"chapter":12,"meta":"Great horses","desc":"Enormous, intelligent horses that choose their own riders. Rare and proud. Dalinar rides one.","tags":["beast"]},{"id":"gloryspren","category":"creatures","name":"Gloryspren","book":1,"chapter":12,"meta":"Spren","desc":"Golden spheres of light that orbit someone experiencing pride or accomplishment.","tags":["spren"]},{"id":"laral","category":"characters","name":"Laral","book":1,"chapter":16,"meta":"Citylord's daughter","desc":"A bright girl with golden-streaked black hair and pale green lighteyes — daughter of Citylord Wistiow of Hearthstone. Plays among the rocks with Kal and Tien.","tags":["family","flashback"]},{"id":"jost","category":"characters","name":"Jost","book":1,"chapter":16,"meta":"Hearthstone boy","desc":"Senior among the Hearthstone boys at fourteen, broad-chested. His father trains him with a quarterstaff. Beats young Kal in a fight, then refuses to teach him.","tags":["flashback","minor"]},{"id":"tranquiline-halls","category":"concepts","name":"The Tranquiline Halls","book":1,"chapter":16,"meta":"Vorin afterlife","desc":"The heavenly realm of Vorin doctrine. Mankind once dwelt there but was cast out; now souls of soldiers fight to reclaim it. The reason warriors are revered above farmers.","tags":["religion","afterlife"]},{"id":"rall-elorim","category":"places","name":"Rall Elorim","book":1,"chapter":16,"meta":"City of Shadows","desc":"A distant city Kaladin hears of in stories — the City of Shadows.","tags":["city","flashback"]},{"id":"kurth","category":"places","name":"Kurth","book":1,"chapter":16,"meta":"City of Lightning","desc":"A distant city Kaladin hears of in stories — the City of Lightning.","tags":["city","flashback"]},{"id":"lavis-polyp","category":"creatures","name":"Lavis polyps","book":1,"chapter":16,"meta":"Staple grain","desc":"Brown melon-shaped grain plants that grow on hillsides. Their dried grain feeds towns and armies. The principal Hearthstone crop.","tags":["plant","food"]},{"id":"markel","category":"creatures","name":"Markel trees","book":1,"chapter":16,"meta":"Stormland tree","desc":"Stout, stone-barked trees with branches as thick as a man's leg. Around their trunks the snarlbrush grows in dense thickets to survive the storms.","tags":["plant"]},{"id":"snarlbrush","category":"creatures","name":"Snarlbrush","book":1,"chapter":16,"meta":"Stormland brush","desc":"Tangled, hardy shrubs that grow in dense thickets at the bases of markel trees, surviving highstorms by clustering together.","tags":["plant"]},{"id":"lurg","category":"creatures","name":"Lurg","book":1,"chapter":16,"meta":"Stormland amphibian","desc":"Small frog-like amphibians that spin watertight cocoons of mucus on stones. Tien delights in collecting them.","tags":["fauna"]},{"id":"nahn","category":"concepts","name":"The Nahn","book":1,"chapter":16,"meta":"Darkeyes rank","desc":"The numerical citizen-rank of darkeyes (1st through 10th nahn, lower numbers higher). Kaladin's family is 2nd nahn — high enough to set them apart, low enough to face suspicion.","tags":["culture"]},{"id":"reshi","category":"factions","name":"The Reshi","book":1,"chapter":16,"meta":"Northern raiders","desc":"A people of the far north who raid in the Alethi wastescum skirmishes. Mentioned only — no Shardblades among them.","tags":["nation"]},{"id":"hobber","category":"characters","name":"Hobber","book":1,"chapter":17,"meta":"Bridgeman","desc":"A bridgeman of Bridge Four. Wounded on a plateau run; survives because Kaladin treats him.","tags":["bridge-four"]},{"id":"murk","category":"characters","name":"Murk","book":1,"chapter":17,"meta":"Bridgeman","desc":"A bridgeman of Bridge Four.","tags":["bridge-four"]},{"id":"drehy","category":"characters","name":"Drehy","book":1,"chapter":17,"meta":"Bridgeman","desc":"A tall, lean bridgeman of Bridge Four.","tags":["bridge-four"]},{"id":"peet","category":"characters","name":"Peet","book":1,"chapter":17,"meta":"Bridgeman","desc":"A bridgeman of Bridge Four.","tags":["bridge-four"]},{"id":"yake","category":"characters","name":"Yake","book":1,"chapter":17,"meta":"Bridgeman","desc":"A bridgeman of Bridge Four.","tags":["bridge-four"]},{"id":"dabbid","category":"characters","name":"Dabbid","book":1,"chapter":17,"meta":"Bridgeman","desc":"A bridgeman gone half-mute with shock after a wound. One of the wounded Kaladin nurses back from the brink.","tags":["bridge-four"]},{"id":"chrysalis","category":"items","name":"Chrysalises","book":1,"chapter":17,"meta":"Plateau prize","desc":"Vast cocoons that chasmfiends climb out of the chasms to spin. Inside lies a gemheart — the prize the bridge runs are for.","tags":["warfront"]},{"id":"plateau-run","category":"concepts","name":"Plateau runs","book":1,"chapter":17,"meta":"The war's pattern","desc":"Whenever a chrysalis is spotted, the army that crosses the chasms first claims its gemheart. Bridge crews carry the bridges; bridges fall, then men do.","tags":["warfront"]},{"id":"aladar","category":"characters","name":"Highprince Aladar","book":1,"chapter":18,"meta":"Alethi highprince","desc":"One of the ten Alethi highprinces. A man of fashion and political subtlety.","tags":["nobility"]},{"id":"ruthar","category":"characters","name":"Highprince Ruthar","book":1,"chapter":18,"meta":"Alethi highprince","desc":"One of the ten Alethi highprinces.","tags":["nobility"]},{"id":"hatham","category":"characters","name":"Highprince Hatham","book":1,"chapter":18,"meta":"Alethi highprince","desc":"One of the ten Alethi highprinces.","tags":["nobility"]},{"id":"thanadal","category":"characters","name":"Highprince Thanadal","book":1,"chapter":18,"meta":"Alethi highprince","desc":"One of the ten Alethi highprinces.","tags":["nobility"]},{"id":"yis","category":"characters","name":"Yis","book":1,"chapter":18,"meta":"Iriali leatherworker","desc":"A yellow-eyed Iriali leatherworker, with stark gold metallic-sheened hair which he keeps capped to avoid drawing notice.","tags":["minor"]},{"id":"avaran","category":"characters","name":"Avaran","book":1,"chapter":18,"meta":"Alethi leatherworker","desc":"An Alethi darkeyes leatherworker, partner to Yis. Examines a cut girth strap from the king's saddle.","tags":["minor"]},{"id":"janala","category":"characters","name":"Janala","book":1,"chapter":18,"meta":"Adolin's courtship","desc":"A fashionable young noblewoman in a sleek yellow dress — Adolin's current lady. Vain, talkative, fond of court gossip.","tags":["nobility"]},{"id":"tibon-marks","category":"characters","name":"Tibon and Marks","book":1,"chapter":18,"meta":"Cobalt Guard","desc":"Two lighteyed members of Dalinar's Cobalt Guard who escort Adolin and Janala on their walk through the warcamp.","tags":["soldier"]},{"id":"kadash","category":"characters","name":"Kadash","book":1,"chapter":18,"meta":"Ardent","desc":"An ardent in Dalinar's service — a former soldier turned priest, with scars to prove it. Counsels Adolin about his father's visions.","tags":["ardent"]},{"id":"voidbinding","category":"concepts","name":"Voidbinding","book":1,"chapter":18,"meta":"Forbidden art","desc":"A dark and evil practice the Heralds themselves denounced — said to involve divining the future. Kadash names it as the soul of the old Hierocracy's mysticism.","tags":["religion","mystery"]},{"id":"iriali","category":"factions","name":"The Iriali","book":1,"chapter":18,"meta":"Western people","desc":"A western people known for their golden, metallic-sheened hair. A lock of Iriali hair is said to bring good luck.","tags":["nation"]},{"id":"dalinar-visions","category":"concepts","name":"Dalinar's Visions","book":1,"chapter":18,"meta":"Highstorm dreams","desc":"During highstorms Dalinar is transported into the bodies of long-dead men, witnessing scenes from before the Recreance. Twelve so far, beginning a few months ago. He believes the Almighty sends them; others fear his mind is failing.","tags":["mystery"]},{"id":"sleek","category":"creatures","name":"Sleeks","book":1,"chapter":18,"meta":"Beast","desc":"A creature mentioned in passing among the warcamp's animals.","tags":["fauna"]},{"id":"midnight-essence","category":"creatures","name":"Midnight Essence","book":1,"chapter":19,"meta":"Vision creature","desc":"In Dalinar's twelfth vision: black, smoke-skinned beasts the size of axehounds that hunt by smell. The Radiant in the vision says they are not Voidbringers but \"Midnight Essence\" — origin unknown.","tags":["vision","mythic"]},{"id":"harkaylain","category":"characters","name":"Harkaylain (in vision)","book":1,"chapter":19,"meta":"Mentioned only","desc":"A name a Knight Radiant speaks in Dalinar's vision: \"Harkaylain says the Desolation is close, and he is not often wrong.\"","tags":["vision"]},{"id":"shadowdays","category":"concepts","name":"The shadowdays","book":1,"chapter":19,"meta":"Mythic age","desc":"The near-mythical age before real history began — when Desolations occurred and the Knights Radiant fought.","tags":["history"]},{"id":"radiant-symbol","category":"items","name":"The Double-Eye Symbol","book":1,"chapter":19,"meta":"Knight Radiant glyph","desc":"A stylized double eye, eight spheres connected with two at the center — the symbol of the Knights Radiant before the Recreance.","tags":["mythic","glyph"]},{"id":"miasal","category":"characters","name":"Miasal","book":1,"chapter":20,"meta":"Hearthstone child","desc":"A five-year-old girl who falls and breaks her leg badly. Young Kal stops the bleeding but cannot save her — his first failure as a surgeon.","tags":["flashback","deceased"]},{"id":"harl","category":"characters","name":"Harl","book":1,"chapter":20,"meta":"Miasal's father","desc":"A thick-shouldered Hearthstone man, Miasal's father. Wails for Kal to save her; later, blames him.","tags":["flashback"]},{"id":"hav","category":"characters","name":"Hav (mentioned)","book":1,"chapter":21,"meta":"Kaladin's old training sergeant","desc":"A figure from Kaladin's army days — the man who used to drag him from his bunk. Spoken to in memory, half-cursing: \"Curse you, Hav. You can boot me out of my bunk even now.\"","tags":["soldier","mentioned"]},{"id":"koolf","category":"characters","name":"Koolf","book":1,"chapter":21,"meta":"Bridgeman","desc":"A bridgeman of Bridge Four.","tags":["bridge-four"]},{"id":"navani","category":"characters","name":"Navani Kholin","book":1,"chapter":22,"meta":"Queen Mother","desc":"Gavilar's widow, Adolin and Renarin's aunt — newly returned to the warcamps. A scholar of fabrials, with a sharp tongue and sharper eye.","tags":["nobility","scholar"]},{"id":"whitespine","category":"creatures","name":"Whitespine","book":1,"chapter":22,"meta":"Predator","desc":"A dangerous predator of Roshar — referred to in passing.","tags":["fauna"]},{"id":"skar","category":"characters","name":"Skar","book":1,"chapter":23,"meta":"Bridgeman","desc":"A short, lean bridgeman of Bridge Four. Bitter at having been a soldier once, demoted to bridge duty.","tags":["bridge-four"]},{"id":"earless-jaks","category":"characters","name":"Earless Jaks","book":1,"chapter":23,"meta":"Bridgeman","desc":"A bridgeman of Bridge Four — earless from some past punishment. Tows stones with Dunny.","tags":["bridge-four"]},{"id":"natam","category":"characters","name":"Natam","book":1,"chapter":23,"meta":"Bridgeman","desc":"A bridgeman of Bridge Four.","tags":["bridge-four"]},{"id":"roshone","category":"characters","name":"Roshone","book":1,"chapter":23,"meta":"Citylord","desc":"The new citylord who replaced Wistiow at Hearthstone — a man Kaladin has reason to despise. Mentioned by name in passing.","tags":["nobility"]},{"id":"knobweed","category":"items","name":"Knobweed sap","book":1,"chapter":23,"meta":"Antiseptic","desc":"Milky white sap milked from knobweed reeds — a powerful antiseptic that scares off rotspren. Each reed yields a single drop, but stockpiled over weeks it sells.","tags":["medicine","plant"]},{"id":"gallery-of-maps","category":"places","name":"The Gallery of Maps","book":1,"chapter":24,"meta":"Warcamp room","desc":"A long hall where maps of the Shattered Plains hang on every wall, lit by spheres and dotted with shalebark plant displays. Where Dalinar talks with the other highprinces.","tags":["warfront"]},{"id":"shalebark","category":"creatures","name":"Shalebark","book":1,"chapter":24,"meta":"Plant","desc":"Crusty, hard, rock-like growths in pinks, vibrant greens and blues. More stone than vegetation, with waving tendrils for hair. Used as decoration in Alethi galleries.","tags":["plant"]},{"id":"breachtree","category":"creatures","name":"Breachtree","book":1,"chapter":25,"meta":"Source of cotton","desc":"A tree whose cotton is woven into thick padded coats for the cold weeks of winter.","tags":["plant"]},{"id":"litima","category":"characters","name":"Litima","book":1,"chapter":26,"meta":"Dalinar's scribe","desc":"A tall, plump scribe of Dalinar's. Reads to him from The Way of Kings — the very copy Gavilar once owned.","tags":["servant"]},{"id":"teleb","category":"characters","name":"Teleb","book":1,"chapter":28,"meta":"Officer","desc":"An officer in Dalinar's army. Demonstrates the wider siege bridges to the Blackthorn.","tags":["soldier"]},{"id":"rysn","category":"characters","name":"Rysn","book":1,"chapter":28,"meta":"Thaylen apprentice","desc":"A young Thaylen merchant-apprentice — fashionable, proud, learning the trade from her babsk Vstim. Travels with him through far lands. Currently in Shinovar.","tags":["interlude","merchant"]},{"id":"vstim","category":"characters","name":"Vstim","book":1,"chapter":28,"meta":"Rysn's babsk","desc":"An older Thaylen merchant in classic stiff robes and a flat-topped hat — Rysn's babsk (master). Patient, knowing, with one long white eyebrow tucked behind his ear.","tags":["interlude","merchant"]},{"id":"babsk","category":"concepts","name":"Babsk","book":1,"chapter":28,"meta":"Thaylen custom","desc":"In Thaylen tradition, a master-merchant who takes on an apprentice — more parent than employer for the duration of training.","tags":["culture","interlude"]},{"id":"axies","category":"characters","name":"Axies the Collector","book":1,"chapter":28,"meta":"Aimian scholar","desc":"An Aimian man — blue-nailed, casual about his own body, devoted to cataloging every species of spren in the world. Wakes naked in an alley and treats it as another day.","tags":["interlude","scholar"]},{"id":"aimian","category":"factions","name":"The Aimians","book":1,"chapter":28,"meta":"Vanishing people","desc":"A strange people whose homeland is mostly destroyed. Axies's body is unusual — blue-nailed, able to sculpt away senses at will.","tags":["nation","interlude"]},{"id":"kasitor","category":"places","name":"Kasitor","book":1,"chapter":28,"meta":"Iriali city","desc":"A city in Iri where Axies wakes in an alley after a night's revelry — lavish, perfumed, with safehands openly displayed.","tags":["city","interlude"]},{"id":"makkek","category":"characters","name":"Makkek","book":1,"chapter":28,"meta":"Szeth's master","desc":"A Bavlander who took Szeth's oathstone from Took. Once a footpad, now a fattening crime lord using Szeth as his masked black-clad assassin. Jealous of the secret of the oathstone.","tags":["interlude","antagonist"]},{"id":"firemoss","category":"items","name":"Firemoss","book":1,"chapter":28,"meta":"Drug","desc":"A moss rubbed between thumb and forefinger to release wisps of smoke and a faint crackling — a euphoric drug, after the calluses form.","tags":["interlude","drug"]},{"id":"bavlanders","category":"factions","name":"The Bavlanders","book":1,"chapter":28,"meta":"Vorin people","desc":"Vorin-descended peoples among whom Szeth is now passed about. Their gambling dens, drinking halls, and courtship customs strike him as strange.","tags":["nation","interlude"]},{"id":"iri","category":"places","name":"Iri","book":1,"chapter":28,"meta":"Western kingdom","desc":"A western kingdom — homeland of the Iriali. Setting of Axies's interlude.","tags":["nation","interlude"]},{"id":"the-letter","category":"concepts","name":"The Letter","book":1,"chapter":18,"meta":"Mysterious epigraphs","desc":"A cryptic letter from one immortal-seeming figure to another, fragments of which appear as chapter epigraphs. Names dropped — Ati, Rayse, the \"old reptile\" — mean nothing yet to mortal readers.","tags":["mystery","epigraph"]}]}</script>

// ---------- localStorage ----------
const LS = {
  progress:  'codex-progress-v1',
  activeId:  'codex-active-id-v1',
  custom:    'codex-custom-v1',
  themeUser: 'codex-theme-user-v1',  // user override (per-codex)
};
const lsGet = (k, fallback) => { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : fallback; } catch { return fallback; } };
const lsSet = (k, v)        => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} };

// ---------- Validation ----------
function validateCodex(data) {
  const errors = [];
  if (!data || typeof data !== 'object') return ['Not a valid JSON object'];
  if (!data.meta || typeof data.meta !== 'object') errors.push('Missing `meta` object');
  else if (!data.meta.title) errors.push('Missing `meta.title`');
  if (!Array.isArray(data.books)) errors.push('Missing `books` array');
  else data.books.forEach((b, i) => {
    if (typeof b.num !== 'number') errors.push(`books[${i}]: missing .num`);
    if (!b.title) errors.push(`books[${i}]: missing .title`);
    if (typeof b.chapters !== 'number') errors.push(`books[${i}]: missing .chapters`);
  });
  if (!data.categories || typeof data.categories !== 'object') errors.push('Missing `categories` object');
  if (!Array.isArray(data.entries)) errors.push('Missing `entries` array');
  else {
    const catKeys = Object.keys(data.categories || {});
    data.entries.forEach((e, i) => {
      if (!e.id) errors.push(`entries[${i}]: missing .id`);
      if (!e.name) errors.push(`entries[${i}]: missing .name`);
      if (!e.category) errors.push(`entries[${i}]: missing .category`);
      else if (catKeys.length && !catKeys.includes(e.category)) errors.push(`entries[${i}] "${e.name}": unknown category "${e.category}"`);
      if (typeof e.book !== 'number') errors.push(`entries[${i}] "${e.name}": missing .book`);
      if (typeof e.chapter !== 'number') errors.push(`entries[${i}] "${e.name}": missing .chapter`);
    });
  }
  return errors;
}
